  * { box-sizing: border-box; }

    const nom = String(nomFichier || '').toLowerCase();

    if (/\.xls$/.test(nom)) throw new Error('Ancien format Excel (.xls) non lu : enregistrez le fichier en .xlsx ou en CSV.');
    if (/\.csv$|\.txt$/.test(nom)) return outilsCsv.lireCsv(outilsCsv.decoderTexte(o));
    throw new Error('Format non reconnu : fichier .csv ou .xlsx attendu.');
  }

  // ------------------------------------------------------------------ brique 2 : contrôles
  function cleColonne(c) {
    return String(c).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  /** Indices des colonnes attendues ; erreur si l'une manque. */
  function reperer(colonnes, attendues) {
    const idx = {}, manquantes = [];
    const cles = colonnes.map(cleColonne);
    attendues.forEach(function (a) {
      const i = cles.indexOf(cleColonne(a));
      if (i < 0) manquantes.push(a); else idx[a] = i;
    });
    return { idx: idx, manquantes: manquantes };
  }

  /** Nombre entier positif ou nul écrit simplement (« 3 », « 3,0 », « 3.0 ») ; sinon null. */
  function entier(v) {
    const s = String(v == null ? '' : v).trim().replace(/\s/g, '');
    if (!/^\d+([.,]0+)?$/.test(s)) return null;
    return parseInt(s, 10);
  }

  /** Année de la rentrée en cours : à partir de septembre, l'année civile ; avant, la précédente. */
  function rentreeEnCours(date) {
    const d = date || new Date();
    return d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  }

  function bilan(erreurs) {
    return { erreurs: erreurs.slice(0, ERREURS_AFFICHEES_MAX), nbErreurs: erreurs.length };
  }

  /**
   * Effectifs par îlot : colonnes ilot, annee, PS … CM2. Le fichier est refusé en entier s'il contient
   * une erreur (pas d'import partiel) ; toutes les erreurs sont listées (50 au plus, plus le total).
   * Années : actuelles ou passées seulement (décision 99).
   * @returns {{ok, erreurs, nbErreurs, avertissements, effectifs, resume}}
   *   effectifs = { ilot: { annee: {PS: n, …} } }
   */
  function validerEffectifs(table, idsIlots, date) {
    const attendues = ['ilot', 'annee'].concat(NIVEAUX);
    const r = reperer(table.colonnes, attendues);
    if (r.manquantes.length) {
      return Object.assign({ ok: false, avertissements: [], effectifs: null, resume: null },
        bilan(['Colonne' + (r.manquantes.length > 1 ? 's' : '') + ' absente' + (r.manquantes.length > 1 ? 's' : '') + ' : ' +
          r.manquantes.join(', ') + '. Colonnes attendues : ' + attendues.join(', ') + ' (téléchargez le modèle).']));
    }
    const connus = new Set(idsIlots);
    const maxAnnee = rentreeEnCours(date);
    const erreurs = [], effectifs = {}, vus = {};
    table.lignes.forEach(function (l) {
      const c = function (nom) { return String(l.cellules[r.idx[nom]] == null ? '' : l.cellules[r.idx[nom]]).trim(); };
      const ilot = c('ilot').toUpperCase();
      const anneeTxt = c('annee');
      const pref = 'Ligne ' + l.numero + ' : ';
      if (!connus.has(ilot)) erreurs.push(pref + 'îlot « ' + c('ilot') + ' » inconnu à La Bastide.');
      const annee = /^\d{4}$/.test(anneeTxt) ? parseInt(anneeTxt, 10) : null;
      if (annee === null) erreurs.push(pref + 'année « ' + anneeTxt + ' » illisible (année de rentrée sur 4 chiffres, ex. 2025).');
      else if (annee > maxAnnee) erreurs.push(pref + 'année ' + annee + ' future : seules les années actuelles ou passées sont acceptées (dernière : ' + maxAnnee + ').');
      const valeurs = {};
      NIVEAUX.forEach(function (n) {
        const brut = c(n);
        if (brut === '') erreurs.push(pref + 'case ' + n + ' vide (écrire 0 s’il n’y a aucun enfant).');
        else {
          const v = entier(brut);
          if (v === null) erreurs.push(pref + 'case ' + n + ' : « ' + brut + ' » n’est pas un nombre entier positif.');
          else valeurs[n] = v;
        }
      });
      if (connus.has(ilot) && annee !== null) {
        const k = ilot + '|' + annee;
        if (vus[k]) erreurs.push(pref + 'îlot ' + ilot + ', année ' + annee + ' déjà présent ligne ' + vus[k] + '.');
        else {
          vus[k] = l.numero;
          (effectifs[ilot] = effectifs[ilot] || {})[annee] = valeurs;
        }
      }
    });
    if (!table.lignes.length) erreurs.push('Aucune ligne de données sous l’en-tête.');
    if (erreurs.length) return Object.assign({ ok: false, avertissements: [], effectifs: null, resume: null }, bilan(erreurs));
    const annees = Array.from(new Set([].concat.apply([], Object.values(effectifs).map(Object.keys)))).sort();
    const totaux = {};
    NIVEAUX.forEach(function (n) { totaux[n] = 0; });
    Object.values(effectifs).forEach(function (parAnnee) {
      Object.values(parAnnee).forEach(function (v) { NIVEAUX.forEach(function (n) { totaux[n] += v[n]; }); });
    });
    // Îlots à compléter dans le fichier (demande du porteur, 17/11/2026) : listés par identifiant.
    const sans = idsIlots.filter(function (id) { return !effectifs[id]; }).sort();
    const avertissements = [];
    if (sans.length) {
      avertissements.push(sans.length + ' îlot' + (sans.length > 1 ? 's' : '') + ' sur ' + idsIlots.length + ' sans aucune ligne : ' +
        sans.join(', ') + '. Leurs effectifs sont inconnus (et non nuls) : ajoutez-les au fichier puis importez-le à nouveau.');
    }
    // Îlots présents certaines années seulement : absents d'une année du fichier.
    const manquants = {};
    annees.forEach(function (a) {
      const m = Object.keys(effectifs).filter(function (id) { return !effectifs[id][a]; }).sort();
      if (m.length) {
        manquants[a] = m;
        avertissements.push('Année ' + a + ' : ' + m.length + ' îlot' + (m.length > 1 ? 's' : '') + ' présent' + (m.length > 1 ? 's' : '') +
          ' pour d’autres années mais pas pour celle-ci : ' + m.join(', ') + '.');
      }
    });
    // Jeu FICTIF réimporté (colonne facultative « source », décision 133) : signalé par un bandeau.
    const iSource = table.colonnes.map(cleColonne).indexOf('source');
    const marque = iSource < 0 ? null : table.lignes.map(function (l) { return String(l.cellules[iSource] == null ? '' : l.cellules[iSource]).trim(); })
      .filter(function (t) { return /^FICTIF/i.test(t); })[0] || null;
    return { ok: true, erreurs: [], nbErreurs: 0, avertissements: avertissements, effectifs: effectifs, fictif: marque,
      resume: { lignes: table.lignes.length, ilots: Object.keys(effectifs).length, ilotsTotal: idsIlots.length, annees: annees, totaux: totaux,
        ilotsSansLigne: sans, manquantsParAnnee: manquants } };
  }

  /**
   * Capacités : colonnes uai, capacite (colonne ecole facultative, pour le lecteur).
   * Une capacité par école, primaire comprise, valable pour toutes les années (décision 100).
   */
  function validerCapacites(table, ecoles) {
    const r = reperer(table.colonnes, ['uai', 'capacite']);
    if (r.manquantes.length) {
      return Object.assign({ ok: false, avertissements: [], capacites: null },
        bilan(['Colonne' + (r.manquantes.length > 1 ? 's' : '') + ' absente' + (r.manquantes.length > 1 ? 's' : '') + ' : ' +
          r.manquantes.join(', ') + '. Colonnes attendues : uai, ecole, capacite (téléchargez le modèle).']));
    }
    const parUai = {};
    ecoles.forEach(function (e) { parUai[e.uai] = e; });
    const erreurs = [], capacites = {}, vus = {};
    table.lignes.forEach(function (l) {
      const c = function (nom) { return String(l.cellules[r.idx[nom]] == null ? '' : l.cellules[r.idx[nom]]).trim(); };
      const uai = c('uai').toUpperCase();
      const pref = 'Ligne ' + l.numero + ' : ';
      if (!parUai[uai]) { erreurs.push(pref + 'code d’école « ' + c('uai') + ' » inconnu à La Bastide.'); return; }
      const v = entier(c('capacite'));
      if (v === null || v === 0) erreurs.push(pref + 'capacité « ' + c('capacite') + ' » : nombre entier supérieur à 0 attendu.');
      else if (vus[uai]) erreurs.push(pref + 'école ' + uai + ' déjà présente ligne ' + vus[uai] + '.');
      else { vus[uai] = l.numero; capacites[uai] = v; }
    });
    if (!table.lignes.length) erreurs.push('Aucune ligne de données sous l’en-tête.');
    if (erreurs.length) return Object.assign({ ok: false, avertissements: [], capacites: null }, bilan(erreurs));
    const sans = ecoles.filter(function (e) { return !capacites[e.uai]; });
    const iSource = table.colonnes.map(cleColonne).indexOf('source');
    const fictif = iSource >= 0 && table.lignes.some(function (l) { return /^FICTIF/i.test(String(l.cellules[iSource] == null ? '' : l.cellules[iSource]).trim()); });
    return { ok: true, erreurs: [], nbErreurs: 0, capacites: capacites, fictif: fictif,
      avertissements: sans.length ? ['Sans capacité (écart non calculable) : ' + sans.map(nomEcole).join(', ') + '.'] : [] };
  }

  // ------------------------------------------------------------------ modèles et libellés
  /** Nom lisible : l'annuaire donne parfois le même nom à la maternelle et à l'élémentaire. */
  // Présentation homogène (demande du porteur, 17/11/2026) : NOM en majuscules, puis (mat.), (ele.) sans accent, ou (GS)
  // pour un groupe scolaire (école primaire, PS à CM2). Le type d'école vient des colonnes de l'annuaire, pas du libellé.
  function nomEcole(e) {
    const type = e.maternelle && e.elementaire ? 'GS' : (e.maternelle ? 'mat.' : 'ele.');
    const nom = String(e.nom).trim().replace(/^[EÉ]cole\s+(maternelle|élémentaire|elementaire|primaire)\s+(publique\s+)?/i, '');
    return nom.toUpperCase() + ' (' + type + ')';
  }

  function celluleCsv(v) {
    const s = String(v);
    return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function versCsv(lignes) {
    return '﻿' + lignes.map(function (l) { return l.map(celluleCsv).join(';'); }).join('\r\n') + '\r\n';
  }

  // ------------------------------------------------------------------ brique A : données FICTIVES (décisions 132, 133, 139)
  // Élèves publiés de chaque ÉCOLE (ref.donnees_fictives), maternelle répartie selon les naissances, puis tirés au
  // hasard entre les îlots de son secteur (carte de démarrage) selon leurs adresses (décision 139 : école par école,
  // le total fictif de chaque école est celui publié ; la croissance reste dans les quartiers neufs). Tirage reproductible :
  // un même numéro de jeu (graine) donne toujours les mêmes effectifs. Un seul jeu proposé (choix du porteur,
  // 17/11/2026 : plusieurs tirages ont les mêmes totaux et ne racontent pas des histoires différentes).
  const JEUX_FICTIFS = [1];
  const ALEA_POIDS = 0.4;   // poids d'un îlot = adresses × (1 ± 0,4) : part de hasard propre à l'îlot, la même chaque année

  /** Générateur de nombres pseudo-aléatoires reproductible (mulberry32), valeurs dans [0, 1[. */
  function hasard(graine) {
    let a = graine >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /** Répartit un entier selon des poids (plus forts restes) ; poids tous nuls : parts égales. */
  function repartirEntier(total, poids) {
    const p = poids.some(function (x) { return x > 0; }) ? poids : poids.map(function () { return 1; });
    const somme = p.reduce(function (a, b) { return a + b; }, 0);
    const brut = p.map(function (x) { return total * x / somme; });
    const parts = brut.map(Math.floor);
    let reste = total - parts.reduce(function (a, b) { return a + b; }, 0);
    brut.map(function (x, i) { return { i: i, f: x - Math.floor(x) }; })
      .sort(function (a, b) { return b.f - a.f || a.i - b.i; })
      .forEach(function (o) { if (reste > 0) { parts[o.i]++; reste--; } });
    return parts;
  }

  /** Rentrées des données fictives : celles publiées, puis la suivante (tendance prolongée, décision 132). */
  function anneesFictives(ref) {
    const a = ref.donnees_fictives.annees.slice();
    return a.concat([String(+a[a.length - 1] + 1)]);
  }

  /** Élèves publiés d'une école pour une rentrée publiée : {PS … CM2} ; école pas encore ouverte : zéros. */
  function elevesPublies(ref, uai, annee) {
    const df = ref.donnees_fictives, r = {};
    NIVEAUX.forEach(function (n) { r[n] = 0; });
    const l = (df.eleves_par_ecole[uai] || {})[annee];
    if (!l) return r;
    const nais = df.naissances_bordeaux, a = +annee;
    const mat = repartirEntier(l.pre, [nais[a - 3], nais[a - 4], nais[a - 5]].map(Number));
    MATERNELLE.forEach(function (n, i) { r[n] = mat[i]; });
    if (ELEMENTAIRE.every(function (n) { return l[n] != null; })) ELEMENTAIRE.forEach(function (n) { r[n] = l[n]; });
    else if (l.elem) {   // détail non publié (petite école) : réparti comme les écoles du quartier la même rentrée
      const poids = ELEMENTAIRE.map(function (n) {
        return Object.keys(df.eleves_par_ecole).reduce(function (s, u) { const x = df.eleves_par_ecole[u][annee]; return s + (x && x[n] != null ? x[n] : 0); }, 0);
      });
      repartirEntier(l.elem, poids).forEach(function (v, i) { r[ELEMENTAIRE[i]] = v; });
    }
    return r;
  }

  /** Élèves d'une école pour une rentrée fictive ; rentrée suivant la dernière publiée : tendance prolongée. */
  function elevesEcole(ref, uai, annee) {
    const pub = ref.donnees_fictives.annees;
    if (pub.indexOf(String(annee)) >= 0) return elevesPublies(ref, uai, String(annee));
    const der = pub[pub.length - 1], avant = pub[pub.length - 2];
    if (+annee !== +der + 1) throw new Error('Rentrée ' + annee + ' hors des données fictives.');
    const v1 = elevesPublies(ref, uai, der), v0 = elevesPublies(ref, uai, avant), r = {};
    NIVEAUX.forEach(function (n) { r[n] = Math.max(0, 2 * v1[n] - v0[n]); });   // 2025 + (2025 − 2024), jamais négatif
    return r;
  }

  /** Effectifs FICTIFS par îlot et par rentrée, au format de l'import : {ilot: {annee: {PS … CM2}}}. */
  function genererFictif(ref, graine) {
    const alea = hasard(graine);
    const ilots = ref.ilots.slice().sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    const poids = {};
    ilots.forEach(function (i) { poids[i.id] = i.nb_adresses * (1 - ALEA_POIDS + 2 * ALEA_POIDS * alea()); });
    const annees = anneesFictives(ref), effectifs = {};
    ilots.forEach(function (i) {
      effectifs[i.id] = {};
      annees.forEach(function (a) { const v = {}; NIVEAUX.forEach(function (n) { v[n] = 0; }); effectifs[i.id][a] = v; });
    });
    let total = 0;
    const tirer = function (ids, nombre, annee, niveau) {   // chaque enfant tiré dans un îlot, selon les poids
      if (!ids.length || !nombre) return;
      const cumul = [];
      ids.reduce(function (s, id) { s += poids[id]; cumul.push(s); return s; }, 0);
      const somme = cumul[cumul.length - 1];
      for (let k = 0; k < nombre; k++) {
        const u = alea() * somme;
        let bas = 0, haut = cumul.length - 1;
        while (bas < haut) { const m = (bas + haut) >> 1; if (cumul[m] > u) haut = m; else bas = m + 1; }
        effectifs[ids[bas]][annee][niveau]++;
      }
      total += nombre;
    };
    ref.ecoles.forEach(function (e) {
      // Îlots du secteur de l'école (carte de démarrage) : ceux dont le couple a cette école pour maternelle (PS-GS)
      // ou pour élémentaire (CP-CM2).
      const secteur = function (cote) {
        return ilots.filter(function (i) { const c = couple(ref, i.demarrage.couple); return c && c[cote] === e.uai; }).map(function (i) { return i.id; });
      };
      const mat = secteur('mat'), elem = secteur('elem');
      annees.forEach(function (a) {
        const eleves = elevesEcole(ref, e.uai, a);
        MATERNELLE.forEach(function (n) { tirer(mat, eleves[n], a, n); });
        ELEMENTAIRE.forEach(function (n) { tirer(elem, eleves[n], a, n); });
      });
    });
    return { effectifs: effectifs, annees: annees, graine: graine, total: total };
  }

  // Capacités FICTIVES (décision 135) : élèves par classe donnés par le porteur (toutes les écoles du quartier en REP :
  // GS, CP, CE1 dédoublés à 15 ; 25 dans les autres niveaux). Hypothèse : autant de classes à chaque niveau de l'école.
  const ELEVES_PAR_CLASSE = { PS: 25, MS: 25, GS: 15, CP: 15, CE1: 15, CE2: 25, CM1: 25, CM2: 25 };

  /** {uai: {capacite, classes, elevesParClasse, origine}} : classes retenues × élèves par classe moyens des niveaux de l'école. */
  function capacitesFictives(ref) {
    const out = {};
    ref.ecoles.forEach(function (e) {
      const niveaux = (e.maternelle ? MATERNELLE : []).concat(e.elementaire ? ELEMENTAIRE : []);
      const moyenne = niveaux.reduce(function (s, n) { return s + ELEVES_PAR_CLASSE[n]; }, 0) / niveaux.length;
      const c = ref.donnees_fictives.classes[e.uai];
      out[e.uai] = { capacite: Math.round(c.classes * moyenne), classes: c.classes, elevesParClasse: Math.round(moyenne * 100) / 100, origine: c.origine };
    });
    return out;
  }

  function versCsvCapacitesFictives(ref) {
    const c = capacitesFictives(ref);
    return versCsv([['uai', 'ecole', 'capacite', 'source']].concat(ref.ecoles.map(function (e) {
      return [e.uai, nomEcole(e), c[e.uai].capacite, 'FICTIF – ' + c[e.uai].classes + ' classes (' + c[e.uai].origine + ')'];
    })));
  }

  /** Jeu fictif au format de l'import, avec une colonne « source » qui le signale à la réimportation. */
  function versCsvFictif(effectifs, libelle) {
    const lignes = [['ilot', 'annee'].concat(NIVEAUX, ['source'])];
    Object.keys(effectifs).sort().forEach(function (id) {
      Object.keys(effectifs[id]).sort().forEach(function (a) {
        lignes.push([id, a].concat(NIVEAUX.map(function (n) { return effectifs[id][a][n]; }), ['FICTIF – ' + libelle]));
      });
    });
    return versCsv(lignes);
  }

  /** Modèle des effectifs : une ligne par îlot pour l'année donnée, cases vides à remplir. */
  function modeleEffectifs(ilots, annee) {
    return versCsv([['ilot', 'annee'].concat(NIVEAUX)].concat(ilots.map(function (i) {
      return [i.id, annee].concat(NIVEAUX.map(function () { return ''; }));
    })));
  }

  function modeleCapacites(ecoles) {
    return versCsv([['uai', 'ecole', 'capacite']].concat(ecoles.map(function (e) { return [e.uai, nomEcole(e), '']; })));
  }

  // ------------------------------------------------------------------ brique 3 : sectorisation par couples
  // Décision 104 : un îlot est affecté à un COUPLE d'écoles — un groupe scolaire, ou une maternelle et
  // l'élémentaire qui lui correspond (un enfant de grande section en maternelle X va au CP de
  // l'élémentaire X). Les enfants de PS à GS de l'îlot vont à la maternelle du couple, ceux de CP à CM2
  // à son élémentaire. Affectations : {ilot: identifiant du couple}.
  const NIVEAU_LIBELLE = { mat: 'maternelle', elem: 'élémentaire' };
  const SEUILS = { bas: 0.9, haut: 1.0 };    // décision 100 : < 90 %, 90 à 100 %, > 100 %

  function couple(ref, id) { return ref.couples.filter(function (c) { return c.id === id; })[0] || null; }

  /** Nom d'un couple, écrit comme les écoles (demande du porteur, 17/11/2026) : « NUITS (mat.) et MONTAUD (ele.) » ;
   *  un groupe scolaire est seul : « MARIE DE GOURNAY (GS) ». Accepte le couple ou son identifiant. */
  function nomCouple(ref, c) {
    if (typeof c === 'string') c = couple(ref, c);
    if (!c) return '';
    const ecole = function (u) { return ref.ecoles.filter(function (e) { return e.uai === u; })[0]; };
    const m = ecole(c.mat), el = ecole(c.elem);
    if (c.mat === c.elem) return m ? nomEcole(m) : c.nom;
    return m && el ? nomEcole(m) + ' et ' + nomEcole(el) : c.nom;
  }

  function affectationsDemarrage(ref) {
    const a = {};
    ref.ilots.forEach(function (i) { a[i.id] = i.demarrage.couple; });
    return a;
  }

  /** Couples proposés pour un îlot : ceux de son secteur commun d'abord (s'il y en a), puis les autres. */
  function couplesProposes(ref, ilotId) {
    const ilot = ref.ilots.filter(function (i) { return i.id === ilotId; })[0];
    const secteur = (ilot && ilot.demarrage.candidats) || [];
    return { secteur: ref.couples.filter(function (c) { return secteur.indexOf(c.id) >= 0; }),
      autres: ref.couples.filter(function (c) { return secteur.indexOf(c.id) < 0; }) };
  }

  /** Change le couple d'un îlot (rend de nouvelles affectations, sans toucher aux anciennes). */
  function deplacer(affectations, ref, ilotId, coupleId) {
    if (!(ilotId in affectations)) throw new Error('Îlot inconnu : ' + ilotId);
    if (!couple(ref, coupleId)) throw new Error('Couple d’écoles inconnu : ' + coupleId);
    const n = Object.assign({}, affectations);
    n[ilotId] = coupleId;
    return n;
  }

  // ------------------------------------------------------------------ brique 5 : effectifs et impact
  /**
   * Effectif de chaque école pour une année : PS à GS des îlots dont le couple a cette école pour
   * maternelle, CP à CM2 des îlots dont le couple l'a pour élémentaire (un groupe scolaire reçoit les deux).
   * Îlots sans effectifs pour cette année : comptés à part (effectif inconnu, pas zéro).
   */
  function effectifsEcoles(affectations, effectifs, ref, annee) {
    const res = {};
    ref.ecoles.forEach(function (e) {
      const niveaux = {};
      NIVEAUX.forEach(function (n) { niveaux[n] = 0; });
      res[e.uai] = { niveaux: niveaux, total: 0, ilots: 0, ilotsSansDonnees: 0, _ilots: {}, _sans: {} };
    });
    Object.keys(affectations).forEach(function (ilot) {
      const c = couple(ref, affectations[ilot]);
      if (!c) return;
      const v = effectifs && effectifs[ilot] && effectifs[ilot][annee];
      [[c.mat, MATERNELLE], [c.elem, ELEMENTAIRE]].forEach(function (p) {
        const r = res[p[0]];
        if (!r) return;
        r._ilots[ilot] = true;
        if (!v) { r._sans[ilot] = true; return; }
        p[1].forEach(function (cl) { r.niveaux[cl] += v[cl]; r.total += v[cl]; });
      });
    });
    Object.keys(res).forEach(function (u) {
      res[u].ilots = Object.keys(res[u]._ilots).length;
      res[u].ilotsSansDonnees = Object.keys(res[u]._sans).length;
      delete res[u]._ilots; delete res[u]._sans;
    });
    return { ecoles: res };
  }

  /** Taux de remplissage et classe (décision 100). Capacité absente : null. */
  function remplissage(effectif, capacite) {
    if (!capacite) return null;
    const taux = effectif / capacite;
    const classe = taux < SEUILS.bas ? 'moins de 90 %' : (taux <= SEUILS.haut ? '90 à 100 %' : 'plus de 100 %');
    return { taux: taux, classe: classe, ecart: capacite - effectif };
  }

  /**
   * Évolution sur une plage de rentrées (demande du porteur, 17/11/2026), pour chaque école : effectif de la carte de
   * démarrage et effectif actuel, remplissage actuel, îlots sans effectifs ; puis l'évolution de l'effectif actuel
   * entre la première et la dernière rentrée de la plage.
   */
  function evolution(affectations, effectifs, ref, capacites, annees) {
    const depart = affectationsDemarrage(ref), res = {};
    ref.ecoles.forEach(function (e) { res[e.uai] = { capacite: (capacites && capacites[e.uai]) || null, annees: {} }; });
    annees.forEach(function (a) {
      const d = effectifsEcoles(depart, effectifs, ref, a), x = effectifsEcoles(affectations, effectifs, ref, a);
      ref.ecoles.forEach(function (e) {
        const u = e.uai;
        res[u].annees[a] = { depart: d.ecoles[u].total, actuel: x.ecoles[u].total, sans: x.ecoles[u].ilotsSansDonnees,
          remplissage: remplissage(x.ecoles[u].total, res[u].capacite) };
      });
    });
    ref.ecoles.forEach(function (e) {
      const r = res[e.uai], p = r.annees[annees[0]], q = r.annees[annees[annees.length - 1]];
      r.variation = annees.length > 1 ? q.actuel - p.actuel : null;
      r.variationPct = annees.length > 1 && p.actuel ? (q.actuel - p.actuel) / p.actuel : null;
    });
    return res;
  }

  /** Écoles touchées par le passage d'un îlot du couple `de` au couple `vers` (maternelles et élémentaires). */
  function ecolesTouchees(ref, de, vers) {
    const u = [];
    [couple(ref, de), couple(ref, vers)].forEach(function (c) {
      if (!c) return;
      [c.mat, c.elem].forEach(function (x) { if (u.indexOf(x) < 0) u.push(x); });
    });
    return u;
  }

  /** Lignes « avant / après » pour les écoles données, une année. */
  function impact(avant, apres, effectifs, ref, capacites, annee, uais) {
    const ea = effectifsEcoles(avant, effectifs, ref, annee);
    const eb = effectifsEcoles(apres, effectifs, ref, annee);
    return uais.filter(Boolean).map(function (u) {
      const cap = capacites ? capacites[u] : undefined;
      return { uai: u, avant: ea.ecoles[u], apres: eb.ecoles[u], capacite: cap || null,
        remplissageAvant: remplissage(ea.ecoles[u].total, cap), remplissageApres: remplissage(eb.ecoles[u].total, cap) };
    });
  }

  // ------------------------------------------------------------------ décision 110 : secteurs d'un seul tenant
  /** Voisinage (calculé à la préparation des données) : îlots qui se touchent et petites surfaces sans adresse. */
  function liens(ref) {
    const l = {};
    ref.ilots.forEach(function (i) { l[i.id] = i.voisins || []; });
    ((ref.fond && ref.fond.sans_adresse) || []).forEach(function (s) { if (s.id) l[s.id] = s.voisins || []; });
    return l;
  }

  /** Pour chaque couple, ses îlots en morceaux d'un seul tenant (le plus grand d'abord). On passe d'un îlot du
   *  couple à un autre par les rues et les petites surfaces sans adresse, jamais par un îlot d'un autre couple. */
  function morceaux(affectations, ref) {
    const l = liens(ref), res = {};
    const parCouple = {};
    Object.keys(affectations).forEach(function (k) { (parCouple[affectations[k]] = parCouple[affectations[k]] || {})[k] = true; });
    Object.keys(parCouple).sort().forEach(function (c) {
      const reste = parCouple[c];
      res[c] = [];
      Object.keys(reste).sort().forEach(function (depart) {
        if (!reste[depart]) return;
        const bloc = [], vus = {}, pile = [depart];
        delete reste[depart]; vus[depart] = true;
        while (pile.length) {
          const k = pile.pop();
          if (k.indexOf('SA-') !== 0) bloc.push(k);
          (l[k] || []).forEach(function (v) {
            if (vus[v]) return;
            if (reste[v]) { delete reste[v]; vus[v] = true; pile.push(v); }
            else if (v.indexOf('SA-') === 0) { vus[v] = true; pile.push(v); }
          });
        }
        res[c].push(bloc.sort());
      });
      res[c].sort(function (a, b) { return b.length - a.length || (a[0] < b[0] ? -1 : 1); });
    });
    return res;
  }

  /** Enclaves : groupes d'îlots détachés du plus grand morceau de leur couple et qui touchent un îlot d'un
   *  autre couple. Un groupe entouré seulement de grandes surfaces sans adresse n'en est pas une. */
  function enclaves(affectations, ref) {
    const l = liens(ref), out = [];
    const m = morceaux(affectations, ref);
    Object.keys(m).forEach(function (c) {
      m[c].slice(1).forEach(function (bloc) {
        const autres = {};
        bloc.forEach(function (k) { (l[k] || []).forEach(function (v) { if (v in affectations && affectations[v] !== c) autres[affectations[v]] = true; }); });
        if (Object.keys(autres).length) out.push({ couple: c, ilots: bloc, voisins: Object.keys(autres).sort() });
      });
    });
    return out;
  }

  /** Couples contigus à un îlot (décision 111) : ceux des îlots qui le touchent, directement ou par une même
   *  petite surface sans adresse (terre-plein, îlot de carrefour) — un seul saut, pour rester au voisinage
   *  immédiat. Contient le couple actuel de l'îlot s'il touche un îlot du même couple. */
  function couplesContigus(affectations, ref, ilotId) {
    const l = liens(ref), trouves = {};
    (l[ilotId] || []).forEach(function (v) {
      if (v.indexOf('SA-') === 0) {
        (l[v] || []).forEach(function (w) { if (w !== ilotId && w in affectations) trouves[affectations[w]] = true; });
      } else if (v in affectations) trouves[affectations[v]] = true;
    });
    return ref.couples.filter(function (c) { return trouves[c.id]; });
  }

  /** Un déplacement est permis (décision 111) si le couple visé est contigu à l'îlot et s'il ne crée aucune
   *  enclave nouvelle (aucun îlot isolé des autres îlots de son secteur). */
  function verifierDeplacement(affectations, ref, ilotId, coupleId) {
    if (affectations[ilotId] === coupleId) return { ok: false, raison: 'L’îlot ' + ilotId + ' est déjà dans ce secteur.' };
    if (!couplesContigus(affectations, ref, ilotId).some(function (c) { return c.id === coupleId; })) {
      return { ok: false, raison: 'Refusé : le secteur « ' + nomCouple(ref, coupleId) + ' » ne touche pas l’îlot ' + ilotId + ' (seuls les secteurs contigus sont permis).' };
    }
    const cle = function (e) { return e.couple + ':' + e.ilots.join(','); };
    const avant = {};
    enclaves(affectations, ref).forEach(function (e) { avant[cle(e)] = true; });
    const nouvelles = enclaves(deplacer(affectations, ref, ilotId, coupleId), ref).filter(function (e) { return !avant[cle(e)]; });
    if (nouvelles.length) {
      return { ok: false, raison: 'Refusé : ce changement isolerait ' + nouvelles.map(function (e) {
        return e.ilots.join(', ') + ' (' + nomCouple(ref, e.couple) + ')';
      }).join(' ; ') + ' du reste de son secteur.' };
    }
    return { ok: true, raison: '' };
  }

  /** Impacts sur les effectifs, à enregistrer : une ligne par école et par année du fichier des effectifs. */
  function versCsvImpacts(affectations, effectifs, ref, capacites) {
    const annees = Array.from(new Set([].concat.apply([], Object.values(effectifs || {}).map(Object.keys)))).sort();
    const depart = affectationsDemarrage(ref);
    const lignes = [['annee_rentree', 'uai', 'ecole', 'capacite', 'effectif_demarrage', 'effectif_actuel', 'variation']
      .concat(NIVEAUX.map(function (n) { return n + '_actuel'; }))
      .concat(['ecart_capacite_actuel', 'remplissage_actuel', 'ilots_sans_effectifs_actuel'])];
    annees.forEach(function (a) {
      const d = effectifsEcoles(depart, effectifs, ref, a), e = effectifsEcoles(affectations, effectifs, ref, a);
      ref.ecoles.forEach(function (ec) {
        const cap = capacites ? capacites[ec.uai] : null;
        const r = remplissage(e.ecoles[ec.uai].total, cap);
        lignes.push([a, ec.uai, nomEcole(ec), cap || '', d.ecoles[ec.uai].total, e.ecoles[ec.uai].total, e.ecoles[ec.uai].total - d.ecoles[ec.uai].total]
          .concat(NIVEAUX.map(function (n) {
            const enseigne = MATERNELLE.indexOf(n) >= 0 ? ec.maternelle : ec.elementaire;
            return enseigne ? e.ecoles[ec.uai].niveaux[n] : '';
          }))
          .concat([r ? r.ecart : '', r ? Math.round(r.taux * 100) + ' % (' + r.classe + ')' : '', e.ecoles[ec.uai].ilotsSansDonnees]));
      });
    });
    return versCsv(lignes);
  }

  // ------------------------------------------------------------------ brique 4 : sauvegarde (fichiers)
  const TYPE_SCENARIO = 'prospective-scolaire-scenario';

  /** Le fichier ne contient que les affectations des îlots (aucun effectif : décision 99). */
  function versScenario(affectations, ref, date) {
    return JSON.stringify({ type: TYPE_SCENARIO, v: 2, quartier: ref.quartier,
      enregistre: (date || new Date()).toISOString(), affectations: affectations }, null, 1);
  }

  /** Contrôle des affectations lues ({ilot: couple}) ; îlots absents : carte de démarrage. */
  function appliquerAffectations(lues, ref, prefixe) {
    const depart = affectationsDemarrage(ref);
    const erreurs = [];
    let absents = 0;
    Object.keys(lues).forEach(function (ilot) {
      if (!(ilot in depart)) erreurs.push('Îlot ' + ilot + ' inconnu.');
      else if (!couple(ref, lues[ilot])) erreurs.push('Îlot ' + ilot + ' : couple d’écoles « ' + lues[ilot] + ' » inconnu.');
      else depart[ilot] = lues[ilot];
    });
    Object.keys(depart).forEach(function (ilot) { if (!(ilot in lues)) absents++; });
    if (erreurs.length) throw new Error(prefixe + erreurs.slice(0, 5).join(' ') + (erreurs.length > 5 ? ' (et ' + (erreurs.length - 5) + ' autres)' : ''));
    return { affectations: depart, absents: absents };
  }

  function lireScenario(texte, ref) {
    let o;
    try { o = JSON.parse(texte); } catch (e) { throw new Error('Ce fichier n’est pas une sectorisation enregistrée par cette application.'); }
    if (!o || o.type !== TYPE_SCENARIO || o.v !== 2 || !o.affectations) throw new Error('Ce fichier n’est pas une sectorisation enregistrée par cette application.');
    if (o.quartier !== ref.quartier) throw new Error('Cette sectorisation concerne « ' + o.quartier + ' », pas ' + ref.quartier + '.');
    const r = appliquerAffectations(o.affectations, ref, 'Fichier refusé : ');
    r.enregistre = o.enregistre;
    return r;
  }

  /** Export pour tableur : une ligne par îlot ; le code du couple fait foi, les noms aident à la lecture. */
  function versCsvSectorisation(affectations, ref) {
    const nom = function (u) { const e = ref.ecoles.filter(function (x) { return x.uai === u; })[0]; return e ? nomEcole(e) : ''; };
    return versCsv([['ilot', 'nb_adresses', 'couple', 'nom_couple', 'ecole_maternelle', 'ecole_elementaire']].concat(
      ref.ilots.map(function (i) {
        const c = couple(ref, affectations[i.id]);
        return [i.id, i.nb_adresses, c.id, nomCouple(ref, c), nom(c.mat), nom(c.elem)];
      })));
  }

  /** Relecture d'un export CSV ou Excel (éventuellement modifié dans un tableur : colonne « couple »). */
  function lireSectorisationTableau(table, ref) {
    const r = reperer(table.colonnes, ['ilot', 'couple']);
    if (r.manquantes.length) throw new Error('Colonnes absentes : ' + r.manquantes.join(', ') + '. Partez d’un fichier exporté par cette application.');
    const lues = {}, erreurs = [], vus = {};
    table.lignes.forEach(function (l) {
      const c = function (n) { return String(l.cellules[r.idx[n]] == null ? '' : l.cellules[r.idx[n]]).trim(); };
      const ilot = c('ilot').toUpperCase(), cp = c('couple').toLowerCase();
      if (vus[ilot]) erreurs.push('Ligne ' + l.numero + ' : îlot ' + ilot + ' en double.');
      else if (!cp) erreurs.push('Ligne ' + l.numero + ' : îlot ' + ilot + ' sans couple d’écoles (tout îlot doit être affecté).');
      else { vus[ilot] = true; lues[ilot] = cp; }
    });
    if (erreurs.length) throw new Error('Fichier refusé : ' + erreurs.slice(0, 5).join(' '));
    return appliquerAffectations(lues, ref, 'Fichier refusé : ');
  }

  // ------------------------------------------------------------------ carte
  /** Projection plane locale (nord en haut) calée sur les îlots ; chemins des îlots, du fond et des écoles. */
  function projeterIlots(ref, largeur) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    ref.ilots.forEach(function (i) { i.contour.forEach(function (r) { r.forEach(function (p) {
      if (p[0] < minX) minX = p[0]; if (p[0] > maxX) maxX = p[0]; if (p[1] < minY) minY = p[1]; if (p[1] > maxY) maxY = p[1];
    }); }); });
    const kx = Math.cos((minY + maxY) / 2 * Math.PI / 180);
    const echelle = largeur / ((maxX - minX) * kx);
    const hauteur = Math.round((maxY - minY) * echelle);
    const pt = function (p) { return ((p[0] - minX) * kx * echelle).toFixed(1) + ',' + ((maxY - p[1]) * echelle).toFixed(1); };
    const polygone = function (anneaux) { return anneaux.map(function (r) { return 'M' + r.map(pt).join('L') + 'Z'; }).join(''); };
    const ligne = function (l) { return 'M' + l.map(pt).join('L'); };
    const fond = ref.fond || { voies: [], voies_ferrees: [], sans_adresse: [], espaces_verts: [] };
    const chemins = {};
    ref.ilots.forEach(function (i) { chemins[i.id] = polygone(i.contour); });
    return { largeur: largeur, hauteur: hauteur, chemins: chemins,
      voies: fond.voies.map(ligne).join(''), voiesFerrees: fond.voies_ferrees.map(ligne).join(''),
      sansAdresse: fond.sans_adresse.map(function (s) { return { d: polygone(s.contour), espaceVert: s.espace_vert }; }),
      espacesVerts: polygone(fond.espaces_verts || []),
      point: function (lon, lat) { const s = pt([lon, lat]).split(','); return { x: +s[0], y: +s[1] }; } };
  }

  return {
    NIVEAU_LIBELLE: NIVEAU_LIBELLE,
    couple: couple,
    nomCouple: nomCouple,
    affectationsDemarrage: affectationsDemarrage,
    couplesProposes: couplesProposes,
    deplacer: deplacer,
    effectifsEcoles: effectifsEcoles,
    remplissage: remplissage,
    ecolesTouchees: ecolesTouchees,
    evolution: evolution,
    impact: impact,
    versScenario: versScenario,
    lireScenario: lireScenario,
    versCsvSectorisation: versCsvSectorisation,
    lireSectorisationTableau: lireSectorisationTableau,
    morceaux: morceaux,
    enclaves: enclaves,
    couplesContigus: couplesContigus,
    verifierDeplacement: verifierDeplacement,
    versCsvImpacts: versCsvImpacts,
    projeterIlots: projeterIlots,
    ITERATIONS: ITERATIONS,
    JEUX_FICTIFS: JEUX_FICTIFS,
    hasard: hasard,
    repartirEntier: repartirEntier,
    anneesFictives: anneesFictives,
    elevesEcole: elevesEcole,
    genererFictif: genererFictif,
    versCsvFictif: versCsvFictif,
    ELEVES_PAR_CLASSE: ELEVES_PAR_CLASSE,
    capacitesFictives: capacitesFictives,
    versCsvCapacitesFictives: versCsvCapacitesFictives,
    LONGUEUR_MDP_MIN: LONGUEUR_MDP_MIN,
    FORMAT_IDENTIFIANT: FORMAT_IDENTIFIANT,
    normaliserIdentifiant: normaliserIdentifiant,
    verifierComptes: verifierComptes,
    NIVEAUX: NIVEAUX,
    MATERNELLE: MATERNELLE,
    ELEMENTAIRE: ELEMENTAIRE,
    chiffrer: chiffrer,
    dechiffrer: dechiffrer,
    lireZip: lireZip,
    lireXlsx: lireXlsx,
    lireTableau: lireTableau,
    entier: entier,
    rentreeEnCours: rentreeEnCours,
    validerEffectifs: validerEffectifs,
    validerCapacites: validerCapacites,
    nomEcole: nomEcole,
    modeleEffectifs: modeleEffectifs,
    modeleCapacites: modeleCapacites
  };
}));
