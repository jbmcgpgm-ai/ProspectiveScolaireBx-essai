    });
  }

  // Connexion réussie : la page ne se recharge pas, le navigateur ne le devine pas toujours. On la lui signale
  // (Credential Management, Edge et Chrome) pour qu'il PROPOSE de retenir l'identifiant et le mot de passe (demande du
  // porteur, 17/11/2026). C'est le gestionnaire de mots de passe du navigateur qui les garde, jamais l'application.
  function proposerMemorisation(id, mdp) {
    try {
      if (window.PasswordCredential && navigator.credentials && navigator.credentials.store) {
        navigator.credentials.store(new window.PasswordCredential({ id: id, password: mdp, name: 'Prospective scolaire de Bordeaux' }))
          .catch(function () { /* refus ou navigateur sans gestionnaire : sans conséquence */ });
      }
    } catch (e) { /* page ouverte depuis un fichier (file://) : non disponible */ }
  }

  function verrouiller() {
    etat.ref = null; etat.effectifs = null; etat.capacites = null; etat.affectations = null; etat.historique = [];
    etat.derniere = null; etat.ilotSel = null; etat.annee = null; etat.projection = null; etat.fictif = null; etat.jeuFictif = null; etat.capFictives = false; etat.plage = null;
    afficherVerrou();
    const m = $('pr-id');
    if (m) m.focus();
  }

  // ------------------------------------------------------------------ brique 2 : import
  function sectionImport(cle, numero, titre, aide, libelleFichier, libelleModele) {
    return '<section class="pr-section" aria-labelledby="pr-h-' + cle + '">' +
      '<h3 id="pr-h-' + cle + '">' + numero + '. ' + esc(titre) + '</h3>' +
      '<p class="cc-aide" id="pr-aide-' + cle + '">' + aide + '</p>' +
      '<div class="cc-actions"><button type="button" class="cc-bouton" id="pr-modele-' + cle + '">' + esc(libelleModele) + '</button></div>' +
      '<label for="pr-fichier-' + cle + '">' + esc(libelleFichier) + '</label>' +
      '<input type="file" id="pr-fichier-' + cle + '" accept=".csv,.xlsx,.txt" aria-describedby="pr-aide-' + cle + ' pr-rapport-' + cle + '">' +
      '<div class="cc-rapport" id="pr-rapport-' + cle + '" aria-live="polite"></div>' +
      '</section>';
  }

  function tableauEcoles() {
    const lignes = etat.ref.ecoles.map(function (e) {
      const cap = etat.capacites && etat.capacites[e.uai];
      const niveaux = e.maternelle && e.elementaire ? 'PS à CM2' : (e.maternelle ? 'PS à GS' : 'CP à CM2');
      return '<tr><th scope="row">' + esc(P.nomEcole(e)) + '</th><td>' + esc(e.uai) + '</td><td>' + niveaux + '</td>' +
        '<td>' + esc(e.adresse) + '</td><td class="pr-nombre">' + (cap ? cap.toLocaleString('fr-FR') : '<span class="pr-inconnu">non importée</span>') + '</td></tr>';
    }).join('');
    return '<table class="pr-table pr-table-ecoles"><caption>' + etat.ref.ecoles.length + ' écoles publiques de La Bastide (annuaire de l’Éducation nationale)</caption>' +
      '<thead><tr><th scope="col">École</th><th scope="col">Code</th><th scope="col">Niveaux</th><th scope="col">Adresse</th><th scope="col">Capacité</th></tr></thead>' +
      '<tbody>' + lignes + '</tbody></table>';
  }

  function afficherMenu() {
    const r = etat.ref;
    contenu().innerHTML = '<div class="panel card pr">' + entete() +
      '<p class="pr-bandeau-fictif" id="pr-bandeau-fictif" role="status" hidden></p>' +
      '<p class="def-text">' + r.ilots.length + ' îlots et ' + r.ecoles.length + ' écoles. ' +
      '<strong>Vos fichiers restent dans ce navigateur</strong> : rien n’est envoyé ni enregistré. Fermer ou recharger la page efface tout.</p>' +
      sectionImport('eff', 1, 'Effectifs par îlot',
        'Une ligne par îlot et par année. Colonnes : <code>ilot</code> (ex. IL-00012), <code>annee</code> (année de rentrée, ex. 2025 pour 2025-2026 ; ' +
        'années actuelles ou passées seulement), puis le nombre d’enfants en <code>PS</code>, <code>MS</code>, <code>GS</code>, <code>CP</code>, ' +
        '<code>CE1</code>, <code>CE2</code>, <code>CM1</code>, <code>CM2</code> (0 s’il n’y en a aucun). Fichier CSV ou Excel (.xlsx). ' +
        'Un fichier qui contient une erreur est refusé en entier, avec la liste des erreurs.',
        'Fichier des effectifs', 'Télécharger le modèle des effectifs (CSV)') +
      htmlFictif() +
      sectionImport('cap', 2, 'Capacités des écoles',
        'Une ligne par école. Colonnes : <code>uai</code> (code de l’école, donné dans le modèle), <code>ecole</code> (nom, pour vous repérer), ' +
        '<code>capacite</code> (nombre maximal d’élèves de l’école, toutes années). Fichier CSV ou Excel (.xlsx).',
        'Fichier des capacités', 'Télécharger le modèle des capacités (CSV)') +
      htmlCapacitesFictives() +
      '<section class="pr-section" aria-labelledby="pr-h-ecoles"><h3 id="pr-h-ecoles">3. Écoles</h3><div id="pr-ecoles">' + tableauEcoles() + '</div></section>' +
      htmlSectorisation() + htmlImpact() +
      '<div class="cc-actions"><button type="button" class="cc-bouton" id="pr-verrouiller">Verrouiller l’application</button></div>' +
      htmlFiabilite() +
      '</div>';
    brancherSectorisation();
    $('pr-modele-eff').addEventListener('click', function () {
      telecharger(P.modeleEffectifs(r.ilots, P.rentreeEnCours()), 'modele_effectifs_ilots_la_bastide.csv');
    });
    $('pr-modele-cap').addEventListener('click', function () {
      telecharger(P.modeleCapacites(r.ecoles), 'modele_capacites_ecoles_la_bastide.csv');
    });
    $('pr-fichier-eff').addEventListener('change', function (ev) { importer(ev.target, 'eff'); });
    brancherFictif();
    brancherCapacitesFictives();
    $('pr-fichier-cap').addEventListener('change', function (ev) { importer(ev.target, 'cap'); });
    $('pr-verrouiller').addEventListener('click', verrouiller);
    $('pr-titre').focus();
  }

  // ------------------------------------------------------------------ briques 3 et 4 : sectorisation
  // Un îlot est affecté à un couple d'écoles (décision 104) : la carte est la même pour la maternelle et
  // l'élémentaire. Couleurs : palette Okabe-Ito (lisible par la plupart des personnes daltoniennes). La
  // couleur n'est jamais seule : légende, liste des îlots par couple et fiche de l'îlot disent la même chose.
  const COULEURS = {
    'benauge': '#E69F00', 'nuits-montaud': '#56B4E9', 'nuyens': '#009E73', 'billie-holiday': '#F0E442',
    'elsa-triolet': '#0072B2', 'franc-sanson': '#D55E00', 'marie-de-gournay': '#CC79A7', 'suzanne-martin': '#882255'
  };
  const LARGEUR_CARTE = 600;
  const calques = { voies: true, ferrees: true, verts: true };

  function ecole(uai) { return etat.ref.ecoles.filter(function (e) { return e.uai === uai; })[0]; }
  function nomUai(uai) { return uai ? P.nomEcole(ecole(uai)) : '—'; }
  function nomCouple(id) { const c = P.couple(etat.ref, id); return c ? P.nomCouple(etat.ref, c) : 'aucun'; }
  function ilotRef(id) { return etat.ref.ilots.filter(function (i) { return i.id === id; })[0]; }

  function htmlSectorisation() {
    return '<section class="pr-section" aria-labelledby="pr-h-sect"><h3 id="pr-h-sect">4. Sectorisation</h3>' +
      '<p class="cc-aide">Chaque îlot est affecté à un couple d’écoles : un groupe scolaire, ou une maternelle et l’élémentaire qui lui correspond ' +
      '(un enfant de grande section de la maternelle X va au CP de l’élémentaire X). Carte de démarrage : carte scolaire 2015 de la Ville, corrigée ' +
      'par les délibérations de 2024 et 2025 ; dans un secteur commun à plusieurs écoles, le couple le plus proche ; îlots sans école connue : ' +
      'couple le plus proche de la majorité de leurs adresses. La fiche de chaque îlot dit d’où vient son affectation.</p>' +
      '<fieldset class="pr-niveau"><legend>Fond de carte</legend>' +
      '<label><input type="checkbox" id="pr-calque-voies" checked> Rues, impasses et passages</label>' +
      '<label><input type="checkbox" id="pr-calque-ferrees" checked> Voies ferrées</label>' +
      '<label><input type="checkbox" id="pr-calque-verts" checked> Parcs et jardins</label></fieldset>' +
      '<div class="pr-carte-et-legende"><div class="pr-carte-cadre"><figure class="pr-carte" id="pr-carte"></figure>' +
      '<div class="pr-menu" id="pr-menu" role="menu" aria-label="Réaffecter l’îlot" hidden></div>' +
      '<div class="pr-infobulle" id="pr-infobulle" role="tooltip" hidden></div></div>' +
      '<div class="pr-legende" id="pr-legende"></div></div>' +
      '<div class="pr-fiche">' +
      '<p class="pr-fiche-titre">Îlot choisi (clic ou clic droit sur la carte)</p>' +
      '<div id="pr-ilot-info" class="pr-ilot-info"></div>' +
      '<p class="cc-rapport-bilan" id="pr-statut" role="status"></p>' +
      // Listes repliées (Q77, 17/11/2026) : le clic droit est le geste principal ; ces listes restent le moyen
      // d'y arriver au clavier, au lecteur d'écran, sur tablette, et pour les très petits îlots (RGAA).
      '<details class="pr-reaff" id="pr-reaff"><summary id="pr-reaff-titre">Réaffecter sans la souris (clavier, tablette, petits îlots)</summary>' +
      '<label for="pr-ilot">Îlot</label><select id="pr-ilot"></select>' +
      '<label for="pr-ecole">Nouveau couple d’écoles (secteurs contigus seulement)</label><select id="pr-ecole"></select>' +
      '<div class="cc-actions"><button type="button" class="cc-bouton cc-principal" id="pr-affecter">Affecter l’îlot à ces écoles</button></div>' +
      '</details>' +
      '</div>' +
      '<div class="pr-controle" id="pr-controle" aria-live="polite"></div>' +
      '<div class="cc-actions">' +
      '<button type="button" class="cc-bouton" id="pr-annuler" disabled>Annuler la dernière modification</button>' +
      '<button type="button" class="cc-bouton" id="pr-reinit">Revenir à la carte de démarrage</button></div>' +
      '<h4 id="pr-h-sauvegarde">Sauvegarder ou reprendre une sectorisation</h4>' +
      '<p class="cc-aide" id="pr-aide-sauvegarde">Les fichiers ne contiennent que les affectations des îlots, jamais les effectifs. Le fichier CSV s’ouvre dans un tableur : ' +
      'vous pouvez y changer la colonne <code>couple</code> (codes : ' + etat.ref.couples.map(function (c) { return '<code>' + esc(c.id) + '</code>'; }).join(', ') +
      ') puis le réimporter.</p>' +
      '<div class="cc-actions" role="group" aria-labelledby="pr-h-sauvegarde">' +
      '<button type="button" class="cc-bouton" id="pr-enregistrer">Enregistrer (fichier de l’application, .json)</button>' +
      '<button type="button" class="cc-bouton" id="pr-export-csv">Exporter pour tableur (.csv)</button>' +
      '<button type="button" class="cc-bouton" id="pr-export-svg">Télécharger la carte (image .svg)</button></div>' +
      '<label for="pr-fichier-scenario">Ouvrir une sectorisation enregistrée (.json, .csv ou .xlsx)</label>' +
      '<input type="file" id="pr-fichier-scenario" accept=".json,.csv,.xlsx" aria-describedby="pr-aide-sauvegarde pr-rapport-scenario">' +
      '<div class="cc-rapport" id="pr-rapport-scenario" aria-live="polite"></div>' +
      '<details class="cc-tableau pr-liste"><summary>Liste des îlots par couple d’écoles (texte de la carte)</summary><div id="pr-liste-ilots"></div></details>' +
      '</section>';
  }

  function dessinerCarte() {
    const proj = etat.projection || (etat.projection = P.projeterIlots(etat.ref, LARGEUR_CARTE));
    const aff = etat.affectations;
    const nbVides = proj.sansAdresse.length;
    let svg = '<svg viewBox="0 0 ' + proj.largeur + ' ' + proj.hauteur + '" role="img" aria-labelledby="pr-carte-titre">' +
      '<title id="pr-carte-titre">Carte des ' + etat.ref.ilots.length + ' îlots de La Bastide colorés selon leur couple d’écoles ; ' + nbVides +
      ' surfaces sans adresse hachurées en gris. Même information en texte dans la liste des îlots par couple.</title>' +
      '<defs><pattern id="pr-h-vide" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="6" height="6" fill="#f2f2f2"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8a8a8a" stroke-width="1.5"/></pattern>' +
      '<pattern id="pr-h-vert" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">' +
      '<line x1="0" y1="0" x2="0" y2="7" stroke="#1b7a3a" stroke-width="2"/></pattern>' +
      '<pattern id="pr-h-vide-vert" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">' +
      '<rect width="6" height="6" fill="#dff0e3"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1b7a3a" stroke-width="1.5"/></pattern></defs>';
    proj.sansAdresse.forEach(function (s) {
      svg += '<path class="pr-vide" d="' + s.d + '" fill-rule="evenodd" fill="url(#' + (s.espaceVert ? 'pr-h-vide-vert' : 'pr-h-vide') + ')" stroke="#bbbbbb" stroke-width="0.4"/>';
    });
    etat.ref.ilots.forEach(function (i) {
      const c = aff[i.id];
      svg += '<path data-ilot="' + esc(i.id) + '" d="' + proj.chemins[i.id] + '" fill-rule="evenodd" fill="' + (COULEURS[c] || '#bbbbbb') +
        '" stroke="#ffffff" stroke-width="0.6"><title>' + esc(i.id + ' : ' + nomCouple(c)) + '</title></path>';
    });
    if (calques.verts && proj.espacesVerts) svg += '<path class="pr-verts" d="' + proj.espacesVerts + '" fill-rule="evenodd" fill="url(#pr-h-vert)" stroke="#1b7a3a" stroke-width="0.8" pointer-events="none"/>';
    if (calques.voies) svg += '<path class="pr-voies" d="' + proj.voies + '" fill="none" stroke="#5f5f5f" stroke-width="0.7" pointer-events="none"/>';
    if (calques.ferrees) svg += '<path class="pr-ferrees" d="' + proj.voiesFerrees + '" fill="none" stroke="#222222" stroke-width="1.6" stroke-dasharray="5 3" pointer-events="none"/>';
    // Îlots changés de secteur par rapport à la carte de démarrage (demande du porteur, 17/11/2026) : contour
    // en pointillés noirs doublé de blanc, lisible sur toutes les couleurs ; nombre dans la légende.
    modifies().forEach(function (id) {
      svg += '<path class="pr-modifie-fond" d="' + proj.chemins[id] + '" fill="none" stroke="#ffffff" stroke-width="3.6" pointer-events="none"/>' +
        '<path class="pr-modifie" data-modifie="' + esc(id) + '" d="' + proj.chemins[id] + '" fill="none" stroke="#000000" stroke-width="2" stroke-dasharray="4 2.5" pointer-events="none"/>';
    });
    // Contour de l'îlot choisi, par-dessus tout, pour rester visible en entier.
    if (etat.ilotSel) svg += '<path d="' + proj.chemins[etat.ilotSel] + '" fill="none" stroke="#000000" stroke-width="3" pointer-events="none"/>';
    etat.ref.ecoles.forEach(function (e) {
      const p = proj.point(e.lon, e.lat);
      const c = etat.ref.couples.filter(function (x) { return x.mat === e.uai || x.elem === e.uai; })[0];
      svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="6" fill="' + (c ? COULEURS[c.id] : '#bbbbbb') +
        '" stroke="#000000" stroke-width="2"><title>' + esc(P.nomEcole(e)) + '</title></circle>';
    });
    $('pr-carte').innerHTML = svg + '</svg><figcaption class="cc-aide">Ronds cerclés de noir : les écoles. Îlot choisi : contour noir épais. ' +
      'Clic droit sur un îlot : menu pour le réaffecter à un secteur contigu (au clavier : listes « Îlot » et « Nouveau couple »).</figcaption>';
  }

  /** Îlots dont le couple actuel diffère de la carte de démarrage. */
  function modifies() {
    return etat.ref.ilots.filter(function (i) { return etat.affectations[i.id] !== i.demarrage.couple; }).map(function (i) { return i.id; });
  }

  function dessinerLegende() {
    const aff = etat.affectations, compte = {};
    Object.keys(aff).forEach(function (k) { compte[aff[k]] = (compte[aff[k]] || 0) + 1; });
    const n = function (k) { return k + ' îlot' + (k > 1 ? 's' : ''); };
    let h = '<p class="pr-legende-titre">Couples d’écoles</p><ul>';
    etat.ref.couples.forEach(function (c) {
      h += '<li><span class="pr-pastille" style="background:' + COULEURS[c.id] + '" aria-hidden="true"></span>' + esc(nomCouple(c.id)) + ' : ' + n(compte[c.id] || 0) + '</li>';
    });
    const vides = etat.ref.fond ? etat.ref.fond.sans_adresse : [];
    const videsVerts = vides.filter(function (s) { return s.espace_vert; }).length;
    h += '</ul><p class="pr-legende-titre">Fond de carte</p><ul>' +
      '<li><span class="pr-pastille pr-pastille-vide" aria-hidden="true"></span>Surface sans adresse : ' + (vides.length - videsVerts) + '</li>' +
      '<li><span class="pr-pastille pr-pastille-vide-vert" aria-hidden="true"></span>Surface sans adresse, espace vert : ' + videsVerts + '</li>' +
      '<li><span class="pr-pastille pr-pastille-vert" aria-hidden="true"></span>Parc ou jardin (y compris dans un îlot)</li>' +
      '<li><span class="pr-trait" aria-hidden="true"></span>Rue, impasse, passage</li>' +
      '<li><span class="pr-trait pr-trait-fer" aria-hidden="true"></span>Voie ferrée</li>' +
      '<li><span class="pr-trait pr-trait-modifie" aria-hidden="true"></span>Îlot changé de secteur (par rapport à la carte de démarrage) : ' + modifies().length + '</li></ul>';
    $('pr-legende').innerHTML = h;
    let liste = '';
    etat.ref.couples.forEach(function (c) {
      const ids = Object.keys(aff).filter(function (k) { return aff[k] === c.id; }).sort();
      if (ids.length) liste += '<p><strong>' + esc(nomCouple(c.id)) + '</strong> (' + ids.length + ') : ' + ids.join(', ') + '</p>';
    });
    const m = modifies();
    liste += '<p><strong>Îlots changés de secteur</strong> (' + m.length + ') : ' + (m.length ? m.map(function (id) {
      return id + ' (' + nomCouple(ilotRef(id).demarrage.couple) + ' → ' + nomCouple(aff[id]) + ')';
    }).join(', ') : 'aucun') + '</p>';
    $('pr-liste-ilots').innerHTML = liste;
  }

  function remplirIlots() {
    const aff = etat.affectations;
    $('pr-ilot').innerHTML = '<option value="">Choisir un îlot…</option>' + etat.ref.ilots.map(function (i) {
      return '<option value="' + esc(i.id) + '"' + (i.id === etat.ilotSel ? ' selected' : '') + '>' +
        esc(i.id + ' (' + i.nb_adresses + ' adresse' + (i.nb_adresses > 1 ? 's' : '') + ') : ' + nomCouple(aff[i.id]) +
          (aff[i.id] !== i.demarrage.couple ? ' — modifié (démarrage : ' + nomCouple(i.demarrage.couple) + ')' : '')) + '</option>';
    }).join('');
  }

  function effectifsTexte(id) {
    const v = etat.effectifs && etat.effectifs[id];
    if (!v) return etat.effectifs ? 'aucun effectif dans le fichier importé (inconnu, et non nul).' : 'importez le fichier des effectifs (étape 1).';
    return Object.keys(v).sort().map(function (a) {
      return a + ' : ' + P.NIVEAUX.map(function (c) { return c + ' ' + v[a][c]; }).join(', ');
    }).join(' ; ');
  }

  function remplirFiche() {
    const id = etat.ilotSel, info = $('pr-ilot-info'), choix = $('pr-ecole');
    if (!id) {
      info.innerHTML = '<p class="cc-aide">Aucun îlot choisi.</p>';
      choix.innerHTML = ''; choix.disabled = true; $('pr-affecter').disabled = true;
      return;
    }
    const i = ilotRef(id), actuel = P.couple(etat.ref, etat.affectations[id]);
    const d = i.demarrage;
    info.innerHTML = '<dl class="pr-dl">' +
      '<dt>Îlot</dt><dd>' + esc(id) + ' (' + i.nb_adresses + ' adresse' + (i.nb_adresses > 1 ? 's' : '') + ')' +
      (actuel.id !== d.couple ? ' — changé de secteur' : '') + '</dd>' +
      '<dt>Couple actuel</dt><dd>' + esc(nomCouple(actuel.id)) + ' : maternelle ' + esc(nomUai(actuel.mat)) + ', élémentaire ' + esc(nomUai(actuel.elem)) + '</dd>' +
      '<dt>Carte de démarrage</dt><dd>' + esc(nomCouple(d.couple)) + ' — ' + esc(d.origine) +
      (d.candidats ? ' (couples possibles : ' + esc(d.candidats.map(nomCouple).join(', ')) + ')' : '') + '</dd>' +
      '<dt>Voies en bordure</dt><dd>' + esc((i.voies || []).join(' → ') || '—') + ' <span class="pr-inconnu">(du nord, sens des aiguilles d’une montre)</span></dd>' +
      '<dt>Adresses</dt><dd><details class="pr-adresses"><summary>' + i.adresses.length + ' adresse' + (i.adresses.length > 1 ? 's' : '') +
      ' (afficher la liste)</summary><ul tabindex="0" aria-label="Adresses de l’îlot ' + esc(id) + '">' + i.adresses.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></details></dd>' +
      '<dt>Effectifs</dt><dd>' + esc(effectifsTexte(id)) + '</dd></dl>';
    const cand = P.couplesContigus(etat.affectations, etat.ref, id).filter(function (c) { return c.id !== actuel.id; });
    if (!cand.length) {
      choix.innerHTML = '<option value="">Aucun secteur contigu : îlot entouré de son seul secteur</option>';
      choix.disabled = true; $('pr-affecter').disabled = true;
      return;
    }
    choix.innerHTML = cand.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(nomCouple(c.id)) + '</option>'; }).join('');
    choix.disabled = false; $('pr-affecter').disabled = false;
  }

  /** Décision 110 : chaque secteur doit être d'un seul tenant ; les enclaves sont signalées (pas bloquées). */
  function dessinerControle() {
    const e = P.enclaves(etat.affectations, etat.ref);
    $('pr-controle').innerHTML = !e.length
      ? '<p class="pr-controle-ok">Contrôle : tous les secteurs sont d’un seul tenant.</p>'
      : '<p class="pr-controle-alerte"><strong>Contrôle : ' + e.length + ' enclave' + (e.length > 1 ? 's' : '') +
        '</strong> (îlots détachés de leur secteur, au contact d’un autre secteur). Chaque secteur doit être d’un seul tenant.</p><ul>' +
        e.map(function (x) {
          return '<li>' + esc(x.ilots.join(', ')) + ' — ' + esc(nomCouple(x.couple)) + ', au contact de ' + esc(x.voisins.map(nomCouple).join(', ')) + '</li>';
        }).join('') + '</ul>';
    return e;
  }

  function rafraichir() {
    dessinerCarte(); dessinerLegende(); remplirIlots(); remplirFiche(); dessinerImpact(); dessinerControle();
    $('pr-annuler').disabled = !etat.historique.length;
  }

  function choisirIlot(id) {
    etat.ilotSel = id || null;
    dessinerCarte(); remplirFiche();
    if ($('pr-ilot').value !== (id || '')) $('pr-ilot').value = id || '';
  }

  function affecter(versChoisi) {
    const id = etat.ilotSel, vers = versChoisi || $('pr-ecole').value;
    const de = etat.affectations[id];
    const v = P.verifierDeplacement(etat.affectations, etat.ref, id, vers);
    if (!v.ok) { $('pr-statut').textContent = v.raison; return; }
    const avant = etat.affectations;
    etat.affectations = P.deplacer(avant, etat.ref, id, vers);
    etat.historique.push({ affectations: avant, derniere: etat.derniere });
    etat.derniere = { ilot: id, de: de, vers: vers, avant: avant, apres: etat.affectations };
    rafraichir();
    const enc = P.enclaves(etat.affectations, etat.ref).filter(function (x) { return x.ilots.indexOf(id) >= 0 || x.couple === de; });
    $('pr-statut').textContent = 'Îlot ' + id + ' : ' + nomCouple(de) + ' → ' + nomCouple(vers) + '.' +
      (enc.length ? ' Attention : ce changement laisse ' + enc.length + ' enclave' + (enc.length > 1 ? 's' : '') + ' (voir le contrôle sous la fiche).' : '');
  }

  // Fenêtre au survol d'un îlot (demande du porteur, 17/11/2026) : voies qui le bordent et adresses.
  // Même information dans la fiche de l'îlot (clavier, lecteur d'écran). Règles du contenu au survol
  // (RGAA 13.9 / WCAG 1.4.13) : la fenêtre se ferme avec Échap, on peut y amener la souris, elle reste
  // affichée tant que la souris est sur l'îlot ou sur elle.
  let infobulleDelai = null, infobulleIlot = null;

  function contenuInfobulle(id) {
    // Voies de la frontière en partant du nord, dans le sens des aiguilles d'une montre ; nombre d'adresses
    // seulement, la liste complète est dans la fiche sous la carte (demande du porteur, 17/11/2026).
    const i = ilotRef(id), n = i.adresses.length;
    return '<p class="pr-ib-titre">' + esc(id) + ' · ' + esc(nomCouple(etat.affectations[id])) + '</p>' +
      '<p><strong>Voies en bordure</strong> (du nord, sens des aiguilles d’une montre) : ' + esc((i.voies || []).join(' → ') || '—') + '</p>' +
      '<p><strong>' + n + ' adresse' + (n > 1 ? 's' : '') + '</strong> — liste complète dans la fiche de l’îlot, sous la carte (cliquez sur l’îlot).</p>';
  }

  function placerInfobulle(x, y) {
    const b = $('pr-infobulle'), cadre = b.parentNode.getBoundingClientRect();
    const l = b.offsetWidth, h = b.offsetHeight;
    let gauche = x - cadre.left + 14, haut = y - cadre.top + 14;
    if (gauche + l > cadre.width) gauche = Math.max(0, x - cadre.left - l - 14);
    if (haut + h > cadre.height) haut = Math.max(0, y - cadre.top - h - 14);
    b.style.left = gauche + 'px'; b.style.top = haut + 'px';
  }

  function montrerInfobulle(id, x, y) {
    if (!$('pr-menu').hidden) return;          // pas de fenêtre de survol quand le menu du clic droit est ouvert
    clearTimeout(infobulleDelai);
    const b = $('pr-infobulle');
    if (infobulleIlot !== id) { b.innerHTML = contenuInfobulle(id); infobulleIlot = id; }
    b.hidden = false;
    placerInfobulle(x, y);
  }

  function cacherInfobulle(apresDelai) {
    clearTimeout(infobulleDelai);
    const cacher = function () { const b = $('pr-infobulle'); if (b) { b.hidden = true; } infobulleIlot = null; };
    if (apresDelai) infobulleDelai = setTimeout(cacher, 250); else cacher();
  }

  // Menu du clic droit (décision 111) : écoles des secteurs contigus à l'îlot. Même choix qu'avec les listes
  // « Îlot » et « Nouveau couple », qui restent le moyen d'y accéder au clavier.
  function ouvrirMenu(id, x, y) {
    choisirIlot(id);
    const m = $('pr-menu'), cadre = m.parentNode.getBoundingClientRect();
    const actuel = etat.affectations[id];
    const cand = P.couplesContigus(etat.affectations, etat.ref, id).filter(function (c) { return c.id !== actuel; });
    m.innerHTML = '<p class="pr-menu-titre">' + esc(id) + ' : ' + esc(nomCouple(actuel)) + '</p>' + (cand.length
      ? cand.map(function (c) {
        return '<button type="button" role="menuitem" data-couple="' + esc(c.id) + '"><span class="pr-pastille" style="background:' + COULEURS[c.id] +
          '" aria-hidden="true"></span>Réaffecter à ' + esc(nomCouple(c.id)) + '</button>';
      }).join('')
      : '<p class="pr-menu-vide">Aucun secteur contigu : cet îlot est entouré de son seul secteur.</p>') +
      '<button type="button" role="menuitem" data-fermer="1" class="pr-menu-fermer">Fermer</button>';
    m.hidden = false;
    const larg = m.offsetWidth, haut = m.offsetHeight;
    m.style.left = Math.max(0, Math.min(x - cadre.left, cadre.width - larg)) + 'px';
    m.style.top = Math.max(0, Math.min(y - cadre.top, cadre.height - haut)) + 'px';
    m.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        const c = b.getAttribute('data-couple');
        fermerMenu(true);
        if (c) affecter(c);
      });
    });
    m.querySelector('button').focus();
  }

  function fermerMenu(rendreFocus) {
    const m = $('pr-menu');
    if (!m || m.hidden) return;
    m.hidden = true;
    m.innerHTML = '';
    if (rendreFocus) ($('pr-reaff').open ? $('pr-ilot') : $('pr-reaff-titre')).focus();
  }

  function clavierMenu(ev) {
    const items = [].slice.call($('pr-menu').querySelectorAll('button'));
    const i = items.indexOf(document.activeElement);
    if (ev.key === 'Escape') { ev.preventDefault(); fermerMenu(true); }
    else if (ev.key === 'ArrowDown') { ev.preventDefault(); items[(i + 1) % items.length].focus(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    else if (ev.key === 'Tab') { fermerMenu(false); }
  }

  function annuler() {
    const h = etat.historique.pop();
    if (!h) return;
    etat.affectations = h.affectations; etat.derniere = h.derniere;
    rafraichir();
    $('pr-statut').textContent = 'Dernière modification annulée.';
  }

  function reinitialiser() {
    if (!window.confirm('Revenir à la carte de démarrage ? Toutes vos modifications non enregistrées seront perdues.')) return;
    etat.affectations = P.affectationsDemarrage(etat.ref); etat.historique = []; etat.derniere = null;
    rafraichir();
    $('pr-statut').textContent = 'Carte de démarrage rétablie.';
  }

  function fichierTelecharge(contenu, type, nom) {
    const url = URL.createObjectURL(new Blob([contenu], { type: type }));
    const a = document.createElement('a');
    a.href = url; a.download = nom;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
  function nomFichier(ext) { return 'sectorisation_la_bastide_' + new Date().toISOString().slice(0, 10) + '.' + ext; }

  function enregistrer() {
    const nom = nomFichier('json');
    fichierTelecharge(P.versScenario(etat.affectations, etat.ref, new Date()), 'application/json', nom);
    $('pr-statut').textContent = 'Sectorisation enregistrée dans le fichier « ' + nom + ' » (affectations seulement, aucun effectif).';
  }

  function exporterCsv() {
    const nom = nomFichier('csv');
    fichierTelecharge(P.versCsvSectorisation(etat.affectations, etat.ref), 'text/csv;charset=utf-8', nom);
    $('pr-statut').textContent = 'Sectorisation exportée pour tableur dans le fichier « ' + nom + ' ».';
  }

  /** Image de la carte avec sa légende écrite dedans (hors du site, les couleurs seules ne disent rien). */
  function exporterSvg() {
    const svg = $('pr-carte').querySelector('svg');
    if (!svg) return;
    const ns = 'http://www.w3.org/2000/svg';
    const l = svg.viewBox.baseVal.width, h = svg.viewBox.baseVal.height;
    const items = [].slice.call($('pr-legende').querySelectorAll('li'));
    const hautLegende = 40 + items.length * 18;
    const copie = svg.cloneNode(true);
    copie.setAttribute('xmlns', ns);
    copie.setAttribute('viewBox', '0 0 ' + l + ' ' + (h + hautLegende));
    copie.setAttribute('width', l);
    copie.setAttribute('height', h + hautLegende);
    const texte = function (x, y, contenu, gras) {
      const t = document.createElementNS(ns, 'text');
      t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('font-size', gras ? '14' : '13');
      t.setAttribute('font-family', 'sans-serif'); if (gras) t.setAttribute('font-weight', 'bold');
      t.textContent = contenu;
      return t;
    };
    const fonds = { 'pr-pastille-vide': 'url(#pr-h-vide)', 'pr-pastille-vide-vert': 'url(#pr-h-vide-vert)', 'pr-pastille-vert': 'url(#pr-h-vert)' };
    copie.appendChild(texte(8, h + 22, 'La Bastide, sectorisation par couples d’écoles (' + new Date().toLocaleDateString('fr-FR') + ')', true));
    items.forEach(function (li, k) {
      const y = h + 34 + k * 18;
      const pastille = li.querySelector('.pr-pastille');
      if (pastille) {
        const r = document.createElementNS(ns, 'rect');
        r.setAttribute('x', 8); r.setAttribute('y', y); r.setAttribute('width', 16); r.setAttribute('height', 13); r.setAttribute('stroke', '#333333');
        const special = Object.keys(fonds).filter(function (c) { return pastille.classList.contains(c); })[0];
        r.setAttribute('fill', special ? fonds[special] : pastille.style.backgroundColor);
        copie.appendChild(r);
      } else {
        const t = document.createElementNS(ns, 'line');
        const fer = li.querySelector('.pr-trait-fer'), modif = li.querySelector('.pr-trait-modifie');
        t.setAttribute('x1', 8); t.setAttribute('x2', 24); t.setAttribute('y1', y + 7); t.setAttribute('y2', y + 7);
        t.setAttribute('stroke', modif ? '#000000' : (fer ? '#222222' : '#5f5f5f')); t.setAttribute('stroke-width', fer || modif ? '2' : '1');
        if (fer) t.setAttribute('stroke-dasharray', '5 3');
        if (modif) t.setAttribute('stroke-dasharray', '4 2.5');
        copie.appendChild(t);
      }
      copie.appendChild(texte(30, y + 11, li.textContent));
    });
    const nom = 'carte_sectorisation_la_bastide_' + new Date().toISOString().slice(0, 10) + '.svg';
    fichierTelecharge(new XMLSerializer().serializeToString(copie), 'image/svg+xml', nom);
    $('pr-statut').textContent = 'Carte téléchargée dans le fichier « ' + nom + ' ».';
  }

  function ouvrirScenario(champ) {
    const f = champ.files && champ.files[0], zone = $('pr-rapport-scenario');
    if (!f) return;
    const lecture = /\.json$/i.test(f.name)
      ? f.text().then(function (t) { return P.lireScenario(t, etat.ref); })
      : f.arrayBuffer().then(function (o) { return P.lireTableau(f.name, o, CC); }).then(function (t) { return P.lireSectorisationTableau(t, etat.ref); });
    lecture.then(function (r) {
      etat.historique.push({ affectations: etat.affectations, derniere: etat.derniere });
      etat.affectations = r.affectations; etat.derniere = null;
      champ.removeAttribute('aria-invalid');
      const abs = r.absents;
      zone.innerHTML = '<p class="cc-rapport-bilan pr-accepte">Sectorisation « ' + esc(f.name) + ' » ouverte' +
        (r.enregistre ? ' (enregistrée le ' + esc(new Date(r.enregistre).toLocaleString('fr-FR')) + ')' : '') + '.' +
        (abs ? ' ' + abs + ' îlot' + (abs > 1 ? 's' : '') + ' absent' + (abs > 1 ? 's' : '') + ' du fichier : carte de démarrage gardée pour ' + (abs > 1 ? 'eux' : 'lui') + '.' : '') + '</p>';
      rafraichir();
    }).catch(function (e) {
      champ.setAttribute('aria-invalid', 'true');
      zone.innerHTML = '<p class="cc-rapport-titre pr-refuse">' + esc(e.message) + '</p>';
    });
  }

  // ------------------------------------------------------------------ brique 5 : impact
  function htmlImpact() {
    return '<section class="pr-section" aria-labelledby="pr-h-impact"><h3 id="pr-h-impact">5. Impact sur les effectifs</h3>' +
      '<div id="pr-impact"></div></section>';
  }

  function nombre(n) { return n == null ? '—' : n.toLocaleString('fr-FR'); }
  // Remplissage et écart en UNE colonne (demande du porteur, 17/11/2026) : « 72 % · 67 places libres ». Le pourcentage
  // écrit porte l'information ; la couleur (< 90 %, 90 à 100 %, > 100 %, décision 100) ne fait que la renforcer.
  function taux(r) {
    if (!r) return '<span class="pr-inconnu">capacité non importée</span>';
    const cls = r.classe === 'moins de 90 %' ? 'pr-r-bas' : (r.classe === '90 à 100 %' ? 'pr-r-moyen' : 'pr-r-haut');
    const ecart = r.ecart >= 0 ? r.ecart.toLocaleString('fr-FR') + ' places libres' : (-r.ecart).toLocaleString('fr-FR') + ' en trop';
    return '<span class="pr-remplissage ' + cls + '" title="Remplissage ' + r.classe + '">' + Math.round(r.taux * 100) + ' % · ' + ecart + '</span>';
  }

  function dessinerImpact() {
    const zone = $('pr-impact');
    if (!zone) return;
    if (!etat.effectifs) {
      zone.innerHTML = '<p class="cc-aide">Importez le fichier des effectifs (étape 1) pour voir l’impact. Les capacités (étape 2) donnent en plus le remplissage.</p>';
      return;
    }
    const annees = Array.from(new Set([].concat.apply([], Object.values(etat.effectifs).map(Object.keys)))).sort();
    // Plage de rentrées (par défaut : toutes les années disponibles) ; la dernière modification est détaillée pour la
    // dernière rentrée de la plage.
    if (!etat.plage || annees.indexOf(etat.plage.de) < 0 || annees.indexOf(etat.plage.a) < 0) etat.plage = { de: annees[0], a: annees[annees.length - 1] };
    if (etat.plage.de > etat.plage.a) etat.plage = { de: etat.plage.a, a: etat.plage.de };
    etat.annee = etat.plage.a;
    const plage = annees.filter(function (a) { return a >= etat.plage.de && a <= etat.plage.a; });
    const options = function (choisie) {
      return annees.map(function (a) { return '<option value="' + a + '"' + (a === choisie ? ' selected' : '') + '>' + a + '-' + (+a + 1) + '</option>'; }).join('');
    };
    let h = '<fieldset class="pr-niveau pr-plage"><legend>Rentrées étudiées</legend>' +
      '<label for="pr-annee-de">De la rentrée</label><select id="pr-annee-de">' + options(etat.plage.de) + '</select>' +
      '<label for="pr-annee-a">à la rentrée</label><select id="pr-annee-a">' + options(etat.plage.a) + '</select></fieldset>';
    const dm = etat.derniere;
    if (dm) {
      const lignes = P.impact(dm.avant, dm.apres, etat.effectifs, etat.ref, etat.capacites, etat.annee, P.ecolesTouchees(etat.ref, dm.de, dm.vers));
      h += '<h4>Dernière modification : îlot ' + esc(dm.ilot) + ', ' + esc(nomCouple(dm.de)) + ' → ' + esc(nomCouple(dm.vers)) + '</h4>' +
        '<div class="pr-defile" tabindex="0" role="region" aria-label="Tableau avant / après (défile horizontalement)"><table class="pr-table"><caption>Effectif des écoles concernées avant et après, rentrée ' + etat.annee + '</caption><thead><tr><th scope="col">École</th><th scope="col">Moment</th>' +
        P.NIVEAUX.map(function (c) { return '<th scope="col" class="pr-nombre">' + c + '</th>'; }).join('') +
        '<th scope="col" class="pr-nombre">Total</th><th scope="col" class="pr-nombre">Capacité</th><th scope="col">Remplissage</th></tr></thead><tbody>';
      lignes.forEach(function (l) {
        const e = ecole(l.uai);
        [['Avant', l.avant, l.remplissageAvant], ['Après', l.apres, l.remplissageApres]].forEach(function (m, k) {
          h += '<tr>' + (k === 0 ? '<th scope="rowgroup" rowspan="2">' + esc(nomUai(l.uai)) + '</th>' : '') + '<td>' + m[0] + '</td>' +
            P.NIVEAUX.map(function (c) {
              const enseigne = P.MATERNELLE.indexOf(c) >= 0 ? e.maternelle : e.elementaire;
              return '<td class="pr-nombre">' + (enseigne ? nombre(m[1].niveaux[c]) : '<span class="pr-inconnu" title="niveau non enseigné">·</span>') + '</td>';
            }).join('') +
            '<td class="pr-nombre">' + nombre(m[1].total) + '</td><td class="pr-nombre">' + nombre(l.capacite) + '</td><td>' + taux(m[2]) + '</td></tr>';
        });
      });
      h += '</tbody></table></div><p class="cc-aide">« · » : niveau que l’école n’accueille pas.</p>';
    } else {
      h += '<p class="cc-aide">Changez le couple d’écoles d’un îlot (étape 4) : l’effectif des écoles concernées, avant et après, s’affichera ici.</p>';
    }
    // Évolution par école sur la plage (demande du porteur, 17/11/2026) : deux lignes par école, « Démarrage » (carte de
    // démarrage) et « Actuel » (sectorisation en cours) ; une colonne par rentrée ; remplissage sous l'effectif actuel.
    // « Îlots sans effectifs » n'est plus une colonne : un astérisque signale un effectif incomplet.
    const ev = P.evolution(etat.affectations, etat.effectifs, etat.ref, etat.capacites, plage);
    let incomplet = false;
    const cellule = function (n, sans) {
      if (sans) incomplet = true;
      return nombre(n) + (sans ? '<span class="pr-incomplet" title="' + sans + ' îlot' + (sans > 1 ? 's' : '') + ' sans effectifs"> *</span>' : '');
    };
    h += '<div class="pr-defile" tabindex="0" role="region" aria-label="Évolution des effectifs par école (défile horizontalement)"><table class="pr-table pr-evolution"><caption>Évolution des effectifs par école, rentrées ' +
      plage[0] + ' à ' + plage[plage.length - 1] + ' : carte de démarrage et sectorisation actuelle</caption><thead><tr>' +
      '<th scope="col">École</th><th scope="col" class="pr-nombre">Capacité</th><th scope="col">Carte</th>' +
      plage.map(function (a) { return '<th scope="col" class="pr-nombre">' + a + '-' + (+a + 1) + '</th>'; }).join('') +
      '<th scope="col" class="pr-nombre"><abbr title="Évolution de l’effectif actuel entre la première et la dernière rentrée de la plage">Évolution</abbr></th></tr></thead>';
    etat.ref.ecoles.forEach(function (e) {
      const r = ev[e.uai];
      const varTxt = r.variation == null ? '—' : (r.variation > 0 ? '+' : '') + r.variation.toLocaleString('fr-FR') +
        (r.variationPct == null ? '' : ' (' + (r.variationPct > 0 ? '+' : '') + Math.round(r.variationPct * 100) + ' %)');
      h += '<tbody><tr><th scope="rowgroup" rowspan="2">' + esc(P.nomEcole(e)) + '</th><td class="pr-nombre" rowspan="2">' + nombre(r.capacite) + '</td>' +
        '<td>Démarrage</td>' + plage.map(function (a) { return '<td class="pr-nombre">' + cellule(r.annees[a].depart, 0) + '</td>'; }).join('') +
        '<td class="pr-nombre" rowspan="2">' + varTxt + '</td></tr>' +
        '<tr class="pr-actuel"><td>Actuel</td>' + plage.map(function (a) {
          const x = r.annees[a];
          return '<td class="pr-nombre"><strong>' + cellule(x.actuel, x.sans) + '</strong>' + (x.remplissage ? '<br>' + taux(x.remplissage) : '') + '</td>';
        }).join('') + '</tr></tbody>';
    });
    h += '</table></div>' + (incomplet ? '<p class="cc-aide">« * » : effectif incomplet, des îlots du secteur n’ont pas d’effectifs pour cette rentrée (ils ne sont pas comptés comme zéro ; le nombre d’îlots s’affiche au survol).</p>' : '') +
      '<div class="cc-actions"><button type="button" class="cc-bouton" id="pr-export-impacts">Enregistrer les impacts sur les effectifs (.csv)</button></div>' +
      '<p class="cc-aide">Une ligne par école et par année de rentrée : capacité, effectif de la carte de démarrage, effectif actuel (par niveau), variation, écart et remplissage. ' +
      'Totaux par école seulement, aucun détail par îlot.</p>';
    zone.innerHTML = h;
    $('pr-export-impacts').addEventListener('click', function () {
      const nom = nomFichier('csv').replace('sectorisation_', 'impacts_effectifs_').replace('.csv', etat.fictif || etat.capFictives ? '_FICTIF.csv' : '.csv');
      fichierTelecharge(P.versCsvImpacts(etat.affectations, etat.effectifs, etat.ref, etat.capacites), 'text/csv;charset=utf-8', nom);
      $('pr-statut').textContent = 'Impacts sur les effectifs enregistrés dans le fichier « ' + nom + ' ».';
    });
    ['pr-annee-de', 'pr-annee-a'].forEach(function (id) {
      $(id).addEventListener('change', function () {
        etat.plage = { de: $('pr-annee-de').value, a: $('pr-annee-a').value };
        dessinerImpact();
        $(id).focus();
      });
    });
  }

  function brancherSectorisation() {
    if (!etat.affectations) { etat.affectations = P.affectationsDemarrage(etat.ref); etat.historique = []; etat.derniere = null; }
    [['pr-calque-voies', 'voies'], ['pr-calque-ferrees', 'ferrees'], ['pr-calque-verts', 'verts']].forEach(function (p) {
      $(p[0]).checked = calques[p[1]];
      $(p[0]).addEventListener('change', function (ev) { calques[p[1]] = ev.target.checked; dessinerCarte(); });
    });
    $('pr-carte').addEventListener('click', function (ev) {
      const p = ev.target.closest && ev.target.closest('path[data-ilot]');
      if (p) choisirIlot(p.getAttribute('data-ilot'));
    });
    $('pr-ilot').addEventListener('change', function (ev) { choisirIlot(ev.target.value); });
    $('pr-affecter').addEventListener('click', function () { affecter(); });
    $('pr-carte').addEventListener('contextmenu', function (ev) {
      const p = ev.target.closest && ev.target.closest('path[data-ilot]');
      if (!p) return;
      ev.preventDefault();
      ouvrirMenu(p.getAttribute('data-ilot'), ev.clientX, ev.clientY);
    });
    $('pr-menu').addEventListener('keydown', clavierMenu);
    $('pr-carte').addEventListener('mousemove', function (ev) {
      const p = ev.target.closest && ev.target.closest('path[data-ilot]');
      if (p) montrerInfobulle(p.getAttribute('data-ilot'), ev.clientX, ev.clientY);
      else cacherInfobulle(true);
    });
    $('pr-carte').addEventListener('mouseleave', function () { cacherInfobulle(true); });
    $('pr-infobulle').addEventListener('mouseenter', function () { clearTimeout(infobulleDelai); });
    $('pr-infobulle').addEventListener('mouseleave', function () { cacherInfobulle(true); });
    $('pr-carte').addEventListener('contextmenu', function () { cacherInfobulle(false); }, true);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && $('pr-infobulle') && !$('pr-infobulle').hidden) cacherInfobulle(false);
    });
    document.addEventListener('mousedown', function (ev) {
      const m = $('pr-menu');
      if (m && !m.hidden && !m.contains(ev.target)) fermerMenu(false);
    });
    $('pr-annuler').addEventListener('click', annuler);
    $('pr-reinit').addEventListener('click', reinitialiser);
    $('pr-enregistrer').addEventListener('click', enregistrer);
    $('pr-export-csv').addEventListener('click', exporterCsv);
    $('pr-export-svg').addEventListener('click', exporterSvg);
    $('pr-fichier-scenario').addEventListener('change', function (ev) { ouvrirScenario(ev.target); });
    rafraichir();
  }

  // ------------------------------------------------------------------ fiabilité des données (17/11/2026)
  function htmlFiabilite() {
    const f = etat.ref.fiabilite;
    if (!f) return '';
    const c = f.chiffres;
    const date = function (iso) { const p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; };
    // Replié par défaut, ouvert d'un clic (demande du porteur, 17/11/2026), comme « Réaffecter sans la souris ».
    return '<section class="pr-section pr-fiabilite" aria-labelledby="pr-h-fiab">' +
      '<details class="pr-reaff" id="pr-fiab"><summary id="pr-h-fiab">Fiabilité des données (sources, limites, chiffres de contrôle)</summary>' +
      '<p class="cc-aide">Ce qu’il faut savoir avant d’utiliser les chiffres et la carte de cette application.</p>' +
      '<h4>Limites connues</h4><ul>' + f.limites.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' +
      '<h4>Chiffres de contrôle</h4><ul>' +
      '<li>' + c.ilots + ' îlots ; ' + c.surfaces_sans_adresse + ' surfaces sans adresse (non affectées).</li>' +
      '<li>' + c.adresses.toLocaleString('fr-FR') + ' adresses, dont ' + c.adresses_a_verifier + ' à position douteuse et ' +
      c.adresses_sans_parcelle + ' sans parcelle cadastrale connue.</li>' +
      '<li>Origine de la carte de démarrage : ' + Object.keys(c.demarrage).map(function (k) { return esc(k) + ' : ' + c.demarrage[k]; }).join(' ; ') + '.</li></ul>' +
      '<h4>Sources</h4><div class="pr-defile" tabindex="0" role="region" aria-label="Sources des données (défile horizontalement)">' +
      '<table class="pr-table"><caption>Données utilisées, avec leur date de collecte</caption><thead><tr><th scope="col">Donnée</th>' +
      '<th scope="col">Source</th><th scope="col">Licence</th><th scope="col">Collecte</th></tr></thead><tbody>' +
      f.sources.map(function (x) {
        return '<tr><th scope="row">' + esc(x.donnee) + '</th><td>' + esc(x.source) + '</td><td>' + esc(x.licence) + '</td><td>' + esc(date(x.collecte)) + '</td></tr>';
      }).join('') + '</tbody></table></div>' +
      '<p class="cc-aide">Effectifs et capacités : fichiers importés par l’utilisateur, jamais envoyés ni enregistrés par l’application.</p></details></section>';
  }

  function rapportErreurs(nom, res) {
    const reste = res.nbErreurs - res.erreurs.length;
    return '<p class="cc-rapport-titre pr-refuse">Fichier « ' + esc(nom) + ' » refusé : ' + res.nbErreurs + ' erreur' + (res.nbErreurs > 1 ? 's' : '') +
      '. Corrigez-les puis importez le fichier à nouveau.</p><ul tabindex="0" aria-label="Erreurs de l’import">' +
      res.erreurs.map(function (e) { return '<li>' + esc(e) + '</li>'; }).join('') +
      (reste > 0 ? '<li>… et ' + reste + ' autre' + (reste > 1 ? 's' : '') + '.</li>' : '') + '</ul>';
  }

  function rapportAvertissements(res) {
    // Liste qui peut défiler (îlots listés) : atteignable au clavier et nommée (RGAA, axe-core scrollable-region-focusable).
    return res.avertissements.length ? '<ul tabindex="0" aria-label="Avertissements de l’import">' +
      res.avertissements.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '';
  }

  // ------------------------------------------------------------------ brique A : données fictives (décisions 132, 133)
  function htmlFictif() {
    const annees = P.anneesFictives(etat.ref);
    return '<section class="pr-section" aria-labelledby="pr-h-fictif"><h3 id="pr-h-fictif">Ou : données fictives (démonstration)</h3>' +
      '<p class="cc-aide" id="pr-aide-fictif">Pas encore de vrais effectifs ? Chargez des effectifs <strong>inventés</strong>, ' +
      'proches de la réalité : élèves publiés des écoles (rentrées ' + annees[0] + ' à ' + annees[annees.length - 2] + ', puis ' +
      annees[annees.length - 1] + ' en prolongeant la tendance), répartis au hasard entre les îlots selon leurs adresses. ' +
      'À utiliser pour essayer l’application, jamais pour décider.</p>' +
      '<div class="cc-actions">' +
      '<button type="button" class="cc-bouton" id="pr-fictif-charger">Charger les effectifs fictifs</button>' +
      '<button type="button" class="cc-bouton" id="pr-fictif-csv" disabled>Télécharger les effectifs fictifs (.csv)</button></div>' +
      '<div class="cc-rapport" id="pr-rapport-fictif" aria-live="polite"></div>' +
      // Consultation du jeu chargé (demande du porteur, 17/11/2026) : enfants par îlot et par niveau, rentrée au choix.
      '<details class="pr-reaff" id="pr-fictif-voir" hidden><summary id="pr-fictif-voir-titre">Voir les effectifs fictifs (enfants par îlot et par niveau)</summary>' +
      '<label for="pr-fictif-annee">Rentrée</label><select id="pr-fictif-annee"></select>' +
      '<div class="pr-defile" tabindex="0" role="region" aria-label="Jeu fictif : enfants par îlot (défile)" id="pr-fictif-tableau"></div>' +
      '</details></section>';
  }

  function chargerFictif(graine, libelle) {
    const g = P.genererFictif(etat.ref, graine);
    etat.effectifs = g.effectifs;
    etat.fictif = libelle;
    etat.jeuFictif = { graine: graine, libelle: libelle };
    $('pr-fichier-eff').value = '';
    $('pr-fichier-eff').removeAttribute('aria-invalid');
    $('pr-rapport-eff').innerHTML = '';
    $('pr-rapport-fictif').innerHTML = '<p class="cc-rapport-bilan pr-accepte">Effectifs fictifs chargés : ' + g.total.toLocaleString('fr-FR') +
      ' élèves sur ' + g.annees.length + ' rentrées (' + g.annees[0] + ' à ' + g.annees[g.annees.length - 1] + '), ' +
      etat.ref.ilots.length + ' îlots. Données FICTIVES.</p>';
    $('pr-fictif-csv').disabled = false;
    $('pr-fictif-annee').innerHTML = g.annees.map(function (a) {
      return '<option value="' + a + '"' + (a === g.annees[g.annees.length - 2] ? ' selected' : '') + '>' + a + '-' + (+a + 1) +
        (a === g.annees[g.annees.length - 1] ? ' (tendance prolongée)' : '') + '</option>';
    }).join('');
    $('pr-fictif-voir').hidden = false;
    dessinerFictif();
    majFictif();
    remplirFiche(); dessinerImpact();
  }

  function brancherFictif() {
    $('pr-fictif-charger').addEventListener('click', function () { chargerFictif(P.JEUX_FICTIFS[0], 'jeu fictif'); });
    $('pr-fictif-annee').addEventListener('change', dessinerFictif);
    $('pr-fictif-csv').addEventListener('click', function () {
      if (!etat.jeuFictif) return;
      const nom = 'effectifs_FICTIFS_la_bastide.csv';
      telecharger(P.versCsvFictif(etat.effectifs, etat.jeuFictif.libelle), nom);
      $('pr-rapport-fictif').insertAdjacentHTML('beforeend', '<p class="cc-aide">Enregistré dans « ' + esc(nom) + ' » : il se réimporte comme un fichier d’effectifs, et reste signalé comme fictif.</p>');
    });
  }

  /** Tableau du jeu fictif chargé, pour une rentrée : une ligne par îlot, une colonne par niveau, totaux. */
  function dessinerFictif() {
    if (!etat.jeuFictif) return;
    const a = $('pr-fictif-annee').value, tot = {};
    P.NIVEAUX.forEach(function (n) { tot[n] = 0; });
    const lignes = etat.ref.ilots.slice().sort(function (x, y) { return x.id < y.id ? -1 : 1; }).map(function (i) {
      const v = etat.effectifs[i.id][a];
      let t = 0;
      const cases = P.NIVEAUX.map(function (n) { tot[n] += v[n]; t += v[n]; return '<td class="pr-nombre">' + v[n] + '</td>'; }).join('');
      return '<tr><th scope="row">' + esc(i.id) + '</th><td>' + esc(nomCouple(i.demarrage.couple)) + '</td>' + cases + '<td class="pr-nombre"><strong>' + t + '</strong></td></tr>';
    }).join('');
    const total = P.NIVEAUX.reduce(function (s, n) { return s + tot[n]; }, 0);
    $('pr-fictif-tableau').innerHTML = '<table class="pr-table pr-table-fictif"><caption>Rentrée ' + a + '-' + (+a + 1) +
      ' : enfants par îlot (données FICTIVES)</caption><thead><tr><th scope="col">Îlot</th><th scope="col">Secteur de départ</th>' +
      P.NIVEAUX.map(function (n) { return '<th scope="col" class="pr-nombre">' + n + '</th>'; }).join('') + '<th scope="col" class="pr-nombre">Total</th></tr></thead>' +
      '<tbody>' + lignes + '</tbody><tfoot><tr><th scope="row">Total</th><td>' + etat.ref.ilots.length + ' îlots</td>' +
      P.NIVEAUX.map(function (n) { return '<td class="pr-nombre"><strong>' + tot[n] + '</strong></td>'; }).join('') +
      '<td class="pr-nombre"><strong>' + total + '</strong></td></tr></tfoot></table>';
  }

  // Capacités fictives (décision 135).
  function htmlCapacitesFictives() {
    const p = P.ELEVES_PAR_CLASSE;
    return '<section class="pr-section" aria-labelledby="pr-h-capfictif"><h3 id="pr-h-capfictif">Ou : capacités fictives (démonstration)</h3>' +
      '<p class="cc-aide">Capacité <strong>inventée</strong> à partir des données publiques : nombre de classes (18 pour les écoles dont la ' +
      'délibération le prévoit, sinon le maximum ouvert depuis 2009) × élèves par classe (' + p.PS + ' en PS, MS, CE2, CM1, CM2 ; ' + p.GS +
      ' en GS, CP, CE1, classes dédoublées en REP), en supposant autant de classes à chaque niveau.</p>' +
      '<div class="cc-actions"><button type="button" class="cc-bouton" id="pr-capfictif">Charger les capacités fictives</button>' +
      '<button type="button" class="cc-bouton" id="pr-capfictif-csv" disabled>Télécharger les capacités fictives (.csv)</button></div>' +
      '<div class="cc-rapport" id="pr-rapport-capfictif" aria-live="polite"></div>' +
      '<details class="pr-reaff" id="pr-capfictif-voir" hidden><summary id="pr-capfictif-voir-titre">Voir les capacités fictives (calcul par école)</summary>' +
      '<div class="pr-defile" tabindex="0" role="region" aria-label="Capacités fictives par école (défile)" id="pr-capfictif-tableau"></div></details></section>';
  }

  function brancherCapacitesFictives() {
    $('pr-capfictif').addEventListener('click', function () {
      const c = P.capacitesFictives(etat.ref), cap = {};
      Object.keys(c).forEach(function (u) { cap[u] = c[u].capacite; });
      etat.capacites = cap;
      etat.capFictives = true;
      $('pr-fichier-cap').value = '';
      $('pr-fichier-cap').removeAttribute('aria-invalid');
      $('pr-rapport-cap').innerHTML = '';
      const total = Object.keys(cap).reduce(function (s, u) { return s + cap[u]; }, 0);
      $('pr-rapport-capfictif').innerHTML = '<p class="cc-rapport-bilan pr-accepte">Capacités fictives chargées : ' + etat.ref.ecoles.length +
        ' écoles, ' + total.toLocaleString('fr-FR') + ' places au total. Données FICTIVES.</p>';
      $('pr-capfictif-tableau').innerHTML = '<table class="pr-table"><caption>Capacités FICTIVES par école</caption><thead><tr><th scope="col">École</th>' +
        '<th scope="col" class="pr-nombre">Classes</th><th scope="col">Origine du nombre de classes</th><th scope="col" class="pr-nombre">Élèves par classe (moyenne)</th>' +
        '<th scope="col" class="pr-nombre">Capacité</th></tr></thead><tbody>' + etat.ref.ecoles.map(function (e) {
          const x = c[e.uai];
          return '<tr><th scope="row">' + esc(P.nomEcole(e)) + '</th><td class="pr-nombre">' + x.classes + '</td><td>' + esc(x.origine) + '</td><td class="pr-nombre">' +
            x.elevesParClasse.toLocaleString('fr-FR') + '</td><td class="pr-nombre"><strong>' + x.capacite + '</strong></td></tr>';
        }).join('') + '</tbody></table>';
      $('pr-capfictif-voir').hidden = false;
      $('pr-capfictif-csv').disabled = false;
      $('pr-ecoles').innerHTML = tableauEcoles();
      majFictif();
      dessinerImpact();
    });
    $('pr-capfictif-csv').addEventListener('click', function () {
      telecharger(P.versCsvCapacitesFictives(etat.ref), 'capacites_FICTIVES_la_bastide.csv');
    });
  }

  /** Bandeau « Données FICTIVES » : visible tant que des effectifs ou des capacités en mémoire sont fictifs. */
  function majFictif() {
    const b = $('pr-bandeau-fictif');
    if (!b) return;
    const quoi = [];
    if (etat.fictif) quoi.push('effectifs : ' + etat.fictif);
    if (etat.capFictives) quoi.push('capacités fictives');
    b.hidden = !quoi.length;
    b.textContent = quoi.length ? 'Données FICTIVES (' + quoi.join(' ; ') + ') : chiffres inventés pour la démonstration. Ne pas utiliser pour décider.' : '';
    if (!etat.capFictives && $('pr-capfictif-csv')) { $('pr-capfictif-csv').disabled = true; $('pr-capfictif-voir').hidden = true; }
    if (!etat.jeuFictif && $('pr-fictif-csv')) { $('pr-fictif-csv').disabled = true; $('pr-fictif-voir').hidden = true; }
  }

  function importer(champ, cle) {
    const f = champ.files && champ.files[0];
    const zone = $('pr-rapport-' + cle);
    if (!f) return;
    zone.innerHTML = '<p class="cc-rapport-bilan">Lecture de « ' + esc(f.name) + ' »…</p>';
    f.arrayBuffer().then(function (octets) {
      return P.lireTableau(f.name, octets, CC);
    }).then(function (table) {
      if (cle === 'eff') {
        const res = P.validerEffectifs(table, etat.ref.ilots.map(function (i) { return i.id; }));
        if (!res.ok) { etat.effectifs = null; champ.setAttribute('aria-invalid', 'true'); zone.innerHTML = rapportErreurs(f.name, res); return; }
        etat.effectifs = res.effectifs;
        etat.fictif = res.fictif ? res.fictif.replace(/^FICTIF\s*[–-]?\s*/i, '') || 'fichier importé' : null;
        etat.jeuFictif = null;
        majFictif();
        champ.removeAttribute('aria-invalid');
        const s = res.resume;
        const total = P.NIVEAUX.reduce(function (t, n) { return t + s.totaux[n]; }, 0);
        zone.innerHTML = '<p class="cc-rapport-bilan pr-accepte">Fichier « ' + esc(f.name) + ' » importé : ' + s.lignes + ' ligne' + (s.lignes > 1 ? 's' : '') +
          ', ' + s.ilots + ' îlots sur ' + s.ilotsTotal + ', année' + (s.annees.length > 1 ? 's' : '') + ' ' + s.annees.join(', ') +
          ' ; ' + total.toLocaleString('fr-FR') + ' enfants au total (toutes années).</p>' + rapportAvertissements(res) +
          (s.ilotsSansLigne.length ? '<div class="cc-actions"><button type="button" class="cc-bouton" id="pr-completer">Télécharger les lignes à compléter (' +
            s.ilotsSansLigne.length + ' îlot' + (s.ilotsSansLigne.length > 1 ? 's' : '') + ', .csv)</button></div>' : '');
        if (s.ilotsSansLigne.length) {
          $('pr-completer').addEventListener('click', function () {
            const garde = {};
            s.ilotsSansLigne.forEach(function (id) { garde[id] = true; });
            const derniere = s.annees[s.annees.length - 1];
            telecharger(P.modeleEffectifs(etat.ref.ilots.filter(function (i) { return garde[i.id]; }), derniere),
              'effectifs_a_completer_la_bastide.csv');
          });
        }
        remplirFiche(); dessinerImpact();
      } else {
        const res = P.validerCapacites(table, etat.ref.ecoles);
        if (!res.ok) { etat.capacites = null; champ.setAttribute('aria-invalid', 'true'); zone.innerHTML = rapportErreurs(f.name, res); $('pr-ecoles').innerHTML = tableauEcoles(); return; }
        etat.capacites = res.capacites;
        etat.capFictives = !!res.fictif;
        majFictif();
        champ.removeAttribute('aria-invalid');
        zone.innerHTML = '<p class="cc-rapport-bilan pr-accepte">Fichier « ' + esc(f.name) + ' » importé : ' + Object.keys(res.capacites).length +
          ' école' + (Object.keys(res.capacites).length > 1 ? 's' : '') + ' sur ' + etat.ref.ecoles.length + '.</p>' + rapportAvertissements(res);
        $('pr-ecoles').innerHTML = tableauEcoles();
        dessinerImpact();
      }
    }).catch(function (e) {
      champ.setAttribute('aria-invalid', 'true');
      zone.innerHTML = '<p class="cc-rapport-titre pr-refuse">Fichier « ' + esc(f.name) + ' » illisible : ' + esc(e.message) + '</p>';
    });
  }

  // ------------------------------------------------------------------ ouverture
  // Application à part (17/11/2026) : l'écran de connexion s'affiche dès l'ouverture de la page.
  afficherVerrou();
  const champ = $('pr-id');
  if (champ) champ.focus();
}());

</script>
</body>
</html>
